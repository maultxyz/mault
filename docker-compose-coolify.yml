# Coolify: assign your domain to web on port 80.
# Pulls the prebuilt images from GHCR; MAULT_IMAGE_TAG pins a release (vX.Y.Z).
# Keep existing credentials and the mault-postgres volume when updating.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mault
      POSTGRES_USER: mault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
    - mault-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mault -d mault
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  server:
    image: ghcr.io/maultxyz/mault-server:${MAULT_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET:?Set IMPERSONATION_SECRET}
      WEB_URL: ${WEB_URL:?Set the public HTTPS origin}
      PORT: 3001
      BOT_URL: ${DOCKER_BOT_URL:-http://bot:${BOT_PORT:-3002}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mault:${POSTGRES_PASSWORD}@postgres:5432/mault}
      NEON_AUTH_URL: ${NEON_AUTH_URL:-}
      MONITOR_LINK_SECRET: ${MONITOR_LINK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SCAN_IMAGE_BUCKET: ${SCAN_IMAGE_BUCKET:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BOT_API_SECRET: ${BOT_API_SECRET:-}
      DEPLOY_API_KEY: ${DEPLOY_API_KEY:-}
      BUY_ME_A_COFFEE_WEBHOOK_SECRET: ${BUY_ME_A_COFFEE_WEBHOOK_SECRET:-}
      ROLLBAR_SERVER_TOKEN: ${ROLLBAR_SERVER_TOKEN:-}
      SHOW_VECTOR_LOGS: ${SHOW_VECTOR_LOGS:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      OWN_AUTH_TOKEN_PEPPER: ${OWN_AUTH_TOKEN_PEPPER:?Set a strong OWN_AUTH_TOKEN_PEPPER}
      VECTORIZE_CONCURRENCY: ${VECTORIZE_CONCURRENCY:-1}
      SYNC_INSERT_BATCH_SIZE: ${SYNC_INSERT_BATCH_SIZE:-50}
      SYNC_VECTORIZE_CONCURRENCY: ${SYNC_VECTORIZE_CONCURRENCY:-1}
      SYNC_IMAGE_FETCH_DELAY_MS: ${SYNC_IMAGE_FETCH_DELAY_MS:-200}
      SYNC_DB_POOL_MAX: ${SYNC_DB_POOL_MAX:-3}
      SYNC_DB_IDLE_TIMEOUT_MS: ${SYNC_DB_IDLE_TIMEOUT_MS:-60000}
      SYNC_DB_CONNECTION_TIMEOUT_MS: ${SYNC_DB_CONNECTION_TIMEOUT_MS:-30000}
      RESYNC_CONCURRENCY: ${RESYNC_CONCURRENCY:-${VECTORIZE_CONCURRENCY:-1}}
      SCAN_VECTORIZE_CONCURRENCY: ${SCAN_VECTORIZE_CONCURRENCY:-4}
      CARD_API_USER_AGENT: ${CARD_API_USER_AGENT:-}
    command:
    - sh
    - -ec
    - |
      if [ "$$AUTH_PROVIDER" = "local" ]; then
        pnpm --filter @magic-vault/server db:migrate-local
      fi
      exec node packages/server/dist/index.js
    expose:
    - '3001'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3001/public/version'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
  web:
    image: ghcr.io/maultxyz/mault-web:${MAULT_IMAGE_TAG:-latest}
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
      VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-}
      VITE_NEON_DATA_API_URL: ${VITE_NEON_DATA_API_URL:-}
      VITE_APP_ENV: ${VITE_APP_ENV:-local}
      VITE_ROLLBAR_ACCESS_TOKEN: ${VITE_ROLLBAR_ACCESS_TOKEN:-}
      VITE_SHOW_SCAN_LOGS: ${VITE_SHOW_SCAN_LOGS:-}
      VITE_API_DOCS_URL: ${VITE_API_DOCS_URL:-}
    depends_on:
      server:
        condition: service_healthy
    expose:
    - '80'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
  bot:
    image: ghcr.io/maultxyz/mault-bot:${MAULT_IMAGE_TAG:-latest}
    environment:
      SERVER_URL: ${DOCKER_SERVER_URL:-http://server:3001}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      DISCORD_WELCOME_GUILD_IDS: ${DISCORD_WELCOME_GUILD_IDS:-}
      BOT_API_SECRET: ${BOT_API_SECRET:-}
      BOT_PORT: ${BOT_PORT:-3002}
      WEB_URL: ${WEB_URL:?Set the public HTTPS origin}
    expose:
    - ${BOT_PORT:-3002}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    command:
    - sh
    - -ec
    - |
      if [ -z "$$DISCORD_BOT_TOKEN" ] && [ -z "$$DISCORD_CLIENT_ID" ]; then
        echo "[bot] Discord is unconfigured; bot disabled."
        exec sleep infinity
      fi
      : "$${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN to enable Discord}"
      : "$${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID to enable Discord}"
      : "$${BOT_API_SECRET:?Set BOT_API_SECRET to enable Discord}"
      exec node packages/bot/dist/index.js
volumes:
  mault-postgres:
