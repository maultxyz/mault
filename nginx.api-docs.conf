server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same /api proxy as nginx.conf, for when VITE_API_URL is left empty and
    # this container shares a network with the server.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream server:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build output never changes, so it can be cached forever, and a
    # missing file is a real 404 rather than index.html served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and the spec change with every deploy, so browsers must
    # always revalidate them; otherwise a cached index.html keeps pointing at
    # asset hashes the new image no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /openapi.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
