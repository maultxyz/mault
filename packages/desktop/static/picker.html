<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'"
    />
    <title>MAULT</title>
    <style>
      @font-face {
        font-family: "Figtree Variable";
        font-style: normal;
        font-weight: 300 900;
        font-display: block;
        src: url("fonts/figtree-latin-wght-normal.woff2") format("woff2-variations");
      }
      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-weight: 100 800;
        font-display: block;
        src: url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
      }
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #292d34;
        --muted: #f7f8f9;
        --border: #e3e5ea;
        --primary: #7b68ee;
        --primary-foreground: #ffffff;
        --primary-hover: color-mix(in oklch, var(--primary), black 12%);
        --primary-text: var(--primary);
        --selected: color-mix(in oklch, var(--primary) 10%, transparent);
        --selected-hover: color-mix(in oklch, var(--primary) 15%, transparent);
        --outline-background: var(--background);
        --outline-hover: var(--muted);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1e1f21;
          --foreground: #e3e4e8;
          --muted: #2a2c30;
          --border: rgb(255 255 255 / 10%);
          --primary-text: oklch(from var(--primary) max(l, 0.72) c h);
          --selected: color-mix(in oklch, var(--primary) 20%, transparent);
          --selected-hover: color-mix(in oklch, var(--primary) 25%, transparent);
          --outline-background: rgb(255 255 255 / 3%);
          --outline-hover: rgb(255 255 255 / 5%);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Figtree Variable", sans-serif;
        font-size: 12px;
        line-height: 16px;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        margin: 0;
        font-family: "JetBrains Mono Variable", monospace;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }
      ul {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      li {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        outline: none;
      }
      li:hover {
        background: var(--muted);
      }
      li[aria-selected="true"] {
        background: var(--selected);
        color: var(--primary-text);
      }
      li[aria-selected="true"]:hover {
        background: var(--selected-hover);
      }
      li small,
      .empty {
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
        font-size: 12px;
      }
      li.name-pending {
        color: color-mix(in oklch, var(--foreground) 70%, transparent);
      }
      li[aria-selected="true"] small {
        color: inherit;
        opacity: 0.8;
      }
      .empty {
        padding: 6px 8px;
        cursor: default;
      }
      .empty:hover {
        background: none;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--outline-background);
        color: var(--foreground);
        font: inherit;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        outline: none;
        transition: background-color 150ms;
      }
      button:hover {
        background: var(--outline-hover);
      }
      button:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px color-mix(in oklch, var(--primary) 30%, transparent);
      }
      button.primary {
        border-color: transparent;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
      }
      button.primary:hover {
        background: var(--primary-hover);
      }
      button:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <ul id="list" role="listbox"></ul>
    <footer>
      <button id="cancel" type="button"></button>
      <button id="connect" class="primary" type="button" disabled></button>
    </footer>
    <script>
      const title = document.getElementById("title");
      const list = document.getElementById("list");
      const cancel = document.getElementById("cancel");
      const connect = document.getElementById("connect");
      let selected = null;

      function render(state) {
        document.title = state.strings.title;
        title.textContent = state.strings.title;
        cancel.textContent = state.strings.cancel;
        connect.textContent = state.strings.connect;
        if (!state.devices.some((device) => device.id === selected)) selected = null;
        connect.disabled = selected === null;
        list.replaceChildren();
        if (state.devices.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = state.strings.searching;
          list.append(empty);
          return;
        }
        for (const device of state.devices) {
          const item = document.createElement("li");
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", String(device.id === selected));
          item.textContent = device.label;
          if (device.isNamePending) item.classList.add("name-pending");
          if (device.detail) {
            const detail = document.createElement("small");
            detail.textContent = device.detail;
            item.append(detail);
          }
          item.addEventListener("click", () => {
            selected = device.id;
            render(state);
          });
          item.addEventListener("dblclick", () => window.picker.choose(device.id));
          list.append(item);
        }
      }

      cancel.addEventListener("click", () => window.picker.choose(""));
      connect.addEventListener("click", () => {
        if (selected !== null) window.picker.choose(selected);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.picker.choose("");
        if (event.key === "Enter" && selected !== null) window.picker.choose(selected);
      });
      window.picker.onState(render);
      window.picker.ready();
    </script>
  </body>
</html>
