<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>MAULT</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #09090b;
        --muted: rgba(9, 9, 11, 0.7);
        --primary: #1447e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: rgba(250, 250, 250, 0.7);
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 8px;
        color: var(--muted);
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="body"></p>
    <button id="retry" type="button"></button>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("title").textContent = params.get("title");
      document.getElementById("body").textContent = params.get("body");
      const retry = document.getElementById("retry");
      retry.textContent = params.get("retry");
      retry.addEventListener("click", () => location.replace(params.get("url")));
    </script>
  </body>
</html>
