appId: xyz.mault.desktop
productName: MAULT
extraMetadata:
  name: mault-desktop
copyright: Copyright © Mault LLC
artifactName: MAULT-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
icon: ../web/public/icon/icon-512.png
mac:
  category: public.app-category.utilities
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: MAULT uses the camera to scan your cards.
    NSBluetoothAlwaysUsageDescription: MAULT uses Bluetooth to connect to your card sorter.
win:
  target: nsis
  extraResources:
    - from: native/koffi
      to: koffi
nsis:
  oneClick: true
  perMachine: false
linux:
  target: AppImage
  category: Utility
publish:
  provider: generic
  url: https://github.com/dishwasher-detergent/mault/releases/download/desktop-latest
