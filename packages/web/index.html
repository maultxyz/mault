    <script>
      if (typeof crypto.randomUUID !== "function") {
        crypto.randomUUID = function () {
          var bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;
          var hex = Array.from(bytes, function (b) {
            return b.toString(16).padStart(2, "0");
          }).join("");
          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      }
    </script>

    <!-- Starts the body font downloading during HTML parse. iOS Safari holds a
         new page's first paint until it counts enough visible content, and it
         didn't count web-font text before the font arrived, so the landing
         page stayed blank for ~30s. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Runs before first paint so the boot shell below already matches the
      // theme next-themes will apply (its own script only runs once React
      // mounts) and, on /app, the React loading screen it hands off to.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var root = document.documentElement;
        root.classList.add(theme);
        root.style.colorScheme = theme;
        if (/^\/app(\/|$)/.test(location.pathname)) root.dataset.boot = "app";
        root.style.setProperty(
          "--loading-logo-offset",
          -Math.round(performance.now() % 1800) + "ms"
        );
      })();
    </script>
    <style>
      /* Boot shell: system-font content that paints immediately, for the
         iOS Safari first-paint rule above. A sibling of #root rather than its
         child, since React's first commit (the root Suspense fallback) would
         clear it before the page has any content; it hides itself once #root
         does. On /app it mirrors AppLoadingScreen's layout and colors so the
         handoff to it doesn't flash. */
      .boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 2147483646;
        background: #fff;
        color: #52525b;
        font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", sans-serif;
      }
      #root:not(:empty) ~ .boot-shell {
        display: none;
      }
      .boot-shell-icon {
        display: grid;
        place-items: center;
        color: #292d34;
      }
      .boot-shell-icon svg {
        width: 56px;
        height: 56px;
      }
      .dark .boot-shell {
        background: #1e1f21;
        color: #a1a1aa;
      }
      .dark .boot-shell-icon {
        color: oklch(0.985 0 0);
      }
      [data-boot="app"] .boot-shell {
        background: #f7f8f9;
      }
      [data-boot="app"].dark .boot-shell {
        background: #000;
      }
      [data-boot="app"] .boot-shell-icon svg {
        width: 48px;
        height: 48px;
      }
      [data-boot="app"] .boot-shell-tagline {
        display: none;
      }
      .loading-logo path {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: loading-logo-hop 1.8s cubic-bezier(0.45, 0, 0.3, 1) infinite both;
        animation-delay: var(--loading-logo-offset, 0ms);
      }

      .loading-logo path:nth-child(2) {
        animation-delay: calc(var(--loading-logo-offset, 0ms) + 110ms);
      }

      .loading-logo path:nth-child(3) {
        transform-origin: 50% 50%;
        animation-name: loading-logo-flip;
        animation-delay: calc(var(--loading-logo-offset, 0ms) + 220ms);
      }

      @keyframes loading-logo-hop {
        0% {
          transform: translateY(0) rotate(0deg) scale(1, 1);
        }
        8% {
          transform: translateY(0) rotate(0deg) scale(1.1, 0.85);
        }
        20% {
          transform: translateY(-30%) rotate(-4deg) scale(0.9, 1.12);
        }
        30% {
          transform: translateY(-36%) rotate(3deg) scale(1, 1);
        }
        40% {
          transform: translateY(0) rotate(0deg) scale(1.14, 0.82);
        }
        48% {
          transform: translateY(0) rotate(0deg) scale(0.95, 1.06);
        }
        56%,
        100% {
          transform: translateY(0) rotate(0deg) scale(1, 1);
        }
      }

      @keyframes loading-logo-flip {
        0% {
          transform: translateY(0) rotate(0deg) scale(1, 1);
        }
        6% {
          transform: translateY(0) rotate(0deg) scale(1.12, 0.86);
        }
        15% {
          transform: translateY(-28%) rotate(0deg) scale(0.92, 1.1);
        }
        23% {
          transform: translateY(0) rotate(0deg) scale(1.14, 0.84);
        }
        30% {
          transform: translateY(-24%) rotate(0deg) scale(0.92, 1.1);
        }
        40% {
          transform: translateY(-62%) rotate(-180deg) scale(1, 1);
        }
        50% {
          transform: translateY(-12%) rotate(-360deg) scale(1, 1);
        }
        55% {
          transform: translateY(0) rotate(-360deg) scale(1.16, 0.8);
        }
        63% {
          transform: translateY(0) rotate(-360deg) scale(0.95, 1.06);
        }
        71%,
        100% {
          transform: translateY(0) rotate(-360deg) scale(1, 1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-logo path {
          animation: none;
        }
      }
    </style>
    <script>
      // ?perf=1 load diagnostics (public/perf-overlay.js). Recorders start
      // here, before any app code, so they cover the whole load. &raf=0 and
      // &panel=0 switch off the frame loop / visible panel individually, to
      // isolate which of them changes iOS Safari's load behavior.
      if (/[?&]perf=1(&|$)/.test(location.search)) {
        (function () {
          var useRaf = !/[?&]raf=0(&|$)/.test(location.search);
          var usePanel = !/[?&]panel=0(&|$)/.test(location.search);
          var P = (window.__perf = { stalls: [], errors: [] });
          if (performance.setResourceTimingBufferSize)
            performance.setResourceTimingBufferSize(1000);
          window.addEventListener("error", function (e) {
            P.errors.push([performance.now(), e.message || String(e.target && (e.target.src || e.target.href))]);
          }, true);
          window.addEventListener("unhandledrejection", function (e) {
            P.errors.push([performance.now(), "rejection: " + String(e.reason)]);
          });
          var last = performance.now();
          if (useRaf)
            (function frame(t) {
              if (t - last > 200) P.stalls.push([last, t - last]);
              last = t;
              if (!P.rootAt || t - P.rootAt < 10000) requestAnimationFrame(frame);
            })(last);
          document.addEventListener("DOMContentLoaded", function () {
            var root = document.getElementById("root");
            new MutationObserver(function (_, obs) {
              if (root.childElementCount > 0) {
                P.rootAt = performance.now();
                obs.disconnect();
              }
            }).observe(root, { childList: true });
          });
          if (usePanel) {
            var s = document.createElement("script");
            s.src = "/perf-overlay.js";
            document.head.appendChild(s);
          }
        })();
      }
    </script>
