<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon icon" type="image/png" href="/icon/Icon.png" />
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />
    <meta name="theme-color" content="#1447e6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAULT</title>
    <!-- Starts the body font downloading during HTML parse. iOS Safari holds a
         new page's first paint until it counts enough visible content, and it
         didn't count web-font text before the font arrived, so the landing
         page stayed blank for ~30s. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Runs before first paint so the boot shell below already matches the
      // theme next-themes will apply (its own script only runs once React
      // mounts) and, on /app, the React loading screen it hands off to.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var root = document.documentElement;
        root.classList.add(theme);
        root.style.colorScheme = theme;
        if (/^\/app(\/|$)/.test(location.pathname)) root.dataset.boot = "app";
      })();
    </script>
    <style>
      /* Boot shell: system-font content that paints immediately, for the
         iOS Safari first-paint rule above. A sibling of #root rather than its
         child, since React's first commit (the root Suspense fallback) would
         clear it before the page has any content; it hides itself once #root
         does. On /app it mirrors AppLoadingScreen's layout and colors so the
         handoff to it doesn't flash. */
      .boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 2147483646;
        background: #fff;
        color: #52525b;
        font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", sans-serif;
      }
      #root:not(:empty) + .boot-shell {
        display: none;
      }
      .boot-shell-icon {
        display: grid;
        place-items: center;
        color: oklch(0.141 0.005 285.823);
      }
      .boot-shell-icon svg {
        width: 56px;
        height: 56px;
      }
      .boot-shell-card-space {
        display: none;
      }
      .dark .boot-shell {
        background: #09090b;
        color: #a1a1aa;
      }
      .dark .boot-shell-icon {
        color: oklch(0.985 0 0);
      }
      [data-boot="app"] .boot-shell {
        gap: 8px;
        background: oklch(0.967 0.001 286.375);
      }
      [data-boot="app"].dark .boot-shell {
        background: #000;
      }
      [data-boot="app"] .boot-shell-icon {
        box-sizing: border-box;
        width: 36px;
        height: 36px;
        margin-bottom: 4px;
        border: 1px solid oklch(0.92 0.004 286.32);
        border-radius: 0.625rem;
        background: oklch(0.141 0.005 285.823 / 4%);
      }
      [data-boot="app"].dark .boot-shell-icon {
        border-color: oklch(1 0 0 / 10%);
        background: oklch(0.985 0 0 / 4%);
      }
      [data-boot="app"] .boot-shell-icon svg {
        width: 28px;
        height: 28px;
      }
      [data-boot="app"] .boot-shell-tagline {
        display: none;
      }
      [data-boot="app"] .boot-shell-card-space {
        display: block;
        height: 144px;
      }
    </style>
    <script>
      // ?perf=1 load diagnostics (public/perf-overlay.js). Recorders start
      // here, before any app code, so they cover the whole load. &raf=0 and
      // &panel=0 switch off the frame loop / visible panel individually, to
      // isolate which of them changes iOS Safari's load behavior.
      if (/[?&]perf=1(&|$)/.test(location.search)) {
        (function () {
          var useRaf = !/[?&]raf=0(&|$)/.test(location.search);
          var usePanel = !/[?&]panel=0(&|$)/.test(location.search);
          var P = (window.__perf = { stalls: [], errors: [] });
          if (performance.setResourceTimingBufferSize)
            performance.setResourceTimingBufferSize(1000);
          window.addEventListener("error", function (e) {
            P.errors.push([performance.now(), e.message || String(e.target && (e.target.src || e.target.href))]);
          }, true);
          window.addEventListener("unhandledrejection", function (e) {
            P.errors.push([performance.now(), "rejection: " + String(e.reason)]);
          });
          var last = performance.now();
          if (useRaf)
            (function frame(t) {
              if (t - last > 200) P.stalls.push([last, t - last]);
              last = t;
              if (!P.rootAt || t - P.rootAt < 10000) requestAnimationFrame(frame);
            })(last);
          document.addEventListener("DOMContentLoaded", function () {
            var root = document.getElementById("root");
            new MutationObserver(function (_, obs) {
              if (root.childElementCount > 0) {
                P.rootAt = performance.now();
                obs.disconnect();
              }
            }).observe(root, { childList: true });
          });
          if (usePanel) {
            var s = document.createElement("script");
            s.src = "/perf-overlay.js";
            document.head.appendChild(s);
          }
        })();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-shell" aria-hidden="true">
      <span class="boot-shell-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 217" fill="none">
          <path fill="currentColor" d="M78.567 70.705c9.79-16.958 31.474-22.768 48.431-12.978a3.545 3.545 0 0 1 1.298 4.844l-48 83.138c-9.79 16.958-31.474 22.768-48.432 12.977a3.545 3.545 0 0 1-1.297-4.843zM131.841 70.705c9.791-16.958 31.475-22.768 48.432-12.978a3.545 3.545 0 0 1 1.298 4.844l-48 83.138c-9.79 16.958-31.474 22.768-48.432 12.977a3.545 3.545 0 0 1-1.297-4.843zM162.526 109.705c9.791-16.958 31.474-22.768 48.432-12.978a3.545 3.545 0 0 1 1.298 4.843l-25.41 44.011c-9.79 16.958-31.474 22.768-48.432 12.978a3.546 3.546 0 0 1-1.298-4.844z" />
        </svg>
      </span>
      <span class="boot-shell-tagline">MAULT · Automated trading card sorting</span>
      <span class="boot-shell-card-space"></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
