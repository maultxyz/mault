name: Build Check

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node for service rendering tests
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test Pi controller without hardware
        run: python3 -m unittest scripts.pi.controller.test_controller

      - name: Test Pi installation, updater and camera without hardware
        run: python3 -m unittest discover -s scripts/pi/tests -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint (web, includes accessibility)
        run: pnpm --filter @magic-vault/web lint

      - name: Test (server)
        run: pnpm --filter @magic-vault/server test

      - name: Test (web)
        run: pnpm --filter @magic-vault/web test
