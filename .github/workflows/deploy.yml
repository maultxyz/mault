name: Release

on:
  # Nightly at 19:17 America/Chicago, off the top of the hour since GitHub
  # delays or drops scheduled runs when load peaks at :00. Cron is UTC-only,
  # so both offsets are scheduled and "Compute deploy flag" keeps only the one
  # matching the current CDT/CST offset. Scheduled runs always use the default branch (master), and
  # only deploy when something changed since the last release tag.
  # Dev deploys are manual only (dispatch on dev, or a dev Firmware Release):
  # no release commit or tag, and images move the :dev tag rather than :latest.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (master only; scheduled runs and dev deploys bump the patch)
        type: choice
        options: [patch, minor, major]
        default: patch
      target:
        description: What to deploy. Anything but everything skips the release commit and tag, so the nightly run still sees the rest as pending.
        type: choice
        options: [everything, web-and-server, bot, api-docs]
        default: everything

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.ref_name == 'dev' && 'dev-release-pipeline' || 'master-release-pipeline' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ vars.APP_URL }}
    env:
      IS_DEV: ${{ github.ref_name == 'dev' }}
      CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
    steps:
      # Dispatching from any other branch would deploy unreleased code to
      # production, so only master and dev are allowed.
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "master" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Deploys run from master (production) or dev (development) only, not ${{ github.ref_name }}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every deploy tags its release commit (vX.Y.Z), so everything after the
      # latest tag is what's pending. Only a manually picked single target
      # deploys regardless of what this reports.
      - name: Detect pending changes since the last release
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
            FILES=$(git diff --name-only "$LAST_TAG" HEAD)
          else
            RANGE="HEAD"
            FILES=$(git ls-files)
          fi

          WEB=false
          SERVER=false
          DOCS=false
          BOT=false
          if grep -qE '^(packages/web/|packages/shared/|Dockerfile\.web$)' <<< "$FILES"; then WEB=true; fi
          if grep -qE '^(packages/server/|packages/shared/|drizzle/|Dockerfile\.server$)' <<< "$FILES"; then SERVER=true; fi
          if grep -qE '^(packages/api-docs/|packages/shared/|Dockerfile\.api-docs$)' <<< "$FILES"; then DOCS=true; fi
          if grep -qE '^(packages/bot/|Dockerfile\.bot$)' <<< "$FILES"; then BOT=true; fi

          COMMITS=$(git log --no-merges --format='%s' "$RANGE" | grep -v '^chore(release):' || true)
          COUNT=$(grep -c . <<< "$COMMITS" || true)
          AUTHORS=$(git log --no-merges --format='%an' "$RANGE" | sort -u | paste -sd ',' - | sed 's/,/, /g')

          {
            echo "web=$WEB"
            echo "server=$SERVER"
            echo "docs=$DOCS"
            echo "bot=$BOT"
            echo "last_tag=$LAST_TAG"
            echo "count=$COUNT"
            echo "authors=$AUTHORS"
            echo "commits<<COMMITS_EOF"
            head -n 15 <<< "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Pending since ${LAST_TAG:-the first commit}: web=$WEB server=$SERVER docs=$DOCS bot=$BOT, $COUNT commit(s)"

      # Web and server are always deployed together: if only one of them
      # changed, deploying just that one would leave the other running an
      # older version, and the two are expected to stay on the same release.
      # "everything" only deploys the containers with changes since the last
      # release tag, which still counts as a full release because the others
      # already run that code. Picking a single target always deploys it, e.g.
      # to retry after a failed Coolify webhook. A partial deploy is not a
      # release: the version gets a -<target>.<sha> suffix and nothing is
      # committed or tagged, since a tag would mark the parts that were left
      # out as deployed.
      - name: Select deploy targets
        id: targets
        env:
          TARGET: ${{ inputs.target || 'everything' }}
        run: |
          WEB_SERVER=false
          DOCS=false
          BOT=false
          case "$TARGET" in
            everything)
              if [ "${{ steps.changes.outputs.web }}" = "true" ] || [ "${{ steps.changes.outputs.server }}" = "true" ]; then WEB_SERVER=true; fi
              DOCS="${{ steps.changes.outputs.docs }}"
              BOT="${{ steps.changes.outputs.bot }}"
              ;;
            web-and-server) WEB_SERVER=true ;;
            api-docs) DOCS=true ;;
            bot) BOT=true ;;
            *) echo "::error::Unknown deploy target $TARGET."; exit 1 ;;
          esac
          LABELS=()
          if [ "$WEB_SERVER" = "true" ]; then LABELS+=("Web" "Server"); fi
          if [ "$DOCS" = "true" ]; then LABELS+=("API docs"); fi
          if [ "$BOT" = "true" ]; then LABELS+=("Bot"); fi
          {
            echo "target=$TARGET"
            echo "partial=$([ "$TARGET" = "everything" ] && echo false || echo true)"
            echo "web_server=$WEB_SERVER"
            echo "docs=$DOCS"
            echo "bot=$BOT"
            echo "labels=$(IFS=,; echo "${LABELS[*]}" | sed 's/,/, /g')"
            echo "any=$([ ${#LABELS[@]} -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $TARGET (${LABELS[*]:-nothing changed})"

      - name: Compute deploy flag
        id: deploy
        run: |
          if [ "$(TZ=America/Chicago date +%Z)" = "CDT" ]; then
            EXPECTED_CRON="17 0 * * *"
          else
            EXPECTED_CRON="17 1 * * *"
          fi
          if [ "${{ steps.targets.outputs.any }}" != "true" ]; then
            echo "Skipping: nothing to deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$EXPECTED_CRON" ]; then
            echo "Skipping: ${{ github.event.schedule }} is not 19:17 America/Chicago today"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Describe release
        id: pr
        run: |
          if [ "$IS_DEV" = "true" ]; then
            TITLE="Dev deploy"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TITLE="Manual deploy"
          else
            TITLE="Nightly deploy (${{ steps.changes.outputs.count }} commits)"
          fi
          if [ "${{ steps.targets.outputs.partial }}" = "true" ]; then
            TITLE="$TITLE (${{ steps.targets.outputs.labels }})"
          fi
          if [ -n "${{ steps.changes.outputs.last_tag }}" ]; then
            URL="https://github.com/${{ github.repository }}/compare/${{ steps.changes.outputs.last_tag }}...${{ github.sha }}"
          else
            URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "title<<PR_TITLE_EOF"
            echo "$TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      # The version is bumped and the OpenAPI spec regenerated in the working
      # tree before the images are built, so the images carry the release
      # version. Nothing is committed or tagged until every image is pushed,
      # so a failed build never leaves a tag behind that makes the next
      # nightly run think nothing is pending. Dev builds keep the current
      # version with a -dev.<sha> suffix, so the web app's version check and
      # the wait step below still see each dev deploy as a new version.
      - name: Compute app version
        id: appversion
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$IS_DEV" = "true" ]; then
            VERSION="${CURRENT}-dev.${GITHUB_SHA::7}"
          elif [ "${{ steps.targets.outputs.partial }}" = "true" ]; then
            VERSION="${CURRENT}-${{ steps.targets.outputs.target }}.${GITHUB_SHA::7}"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            case "${{ inputs.bump || 'patch' }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)
                MAJOR_MINOR="${MAJOR}.${MINOR}"
                CURRENT_PATCH=$(echo "$CURRENT" | grep -oP '\d+$')
                LAST=$(git tag -l "v${MAJOR_MINOR}.*" | grep -E "^v${MAJOR_MINOR}\.[0-9]+$" | sed -E "s/^v${MAJOR_MINOR}\.//" | sort -n | tail -1)
                LAST="${LAST:-$CURRENT_PATCH}"
                VERSION="${MAJOR_MINOR}.$((LAST + 1))"
                ;;
            esac
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists."
              exit 1
            fi
          fi
          node scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # The API reference site serves this file as-is, so the spec is
      # regenerated here (with the new version), baked into the API docs image
      # and committed with the release rather than generated at build time.
      - name: Generate OpenAPI spec
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true'
        run: |
          pnpm install --frozen-lockfile --filter @magic-vault/api-docs...
          pnpm --filter @magic-vault/api-docs openapi

      - name: Compute image names
        id: images
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          PREFIX="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/mault"
          {
            echo "web=$PREFIX-web"
            echo "server=$PREFIX-server"
            echo "docs=$PREFIX-api-docs"
            echo "bot=$PREFIX-bot"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dev deploys flash the firmware-dev pre-release when one exists (see
      # firmware-release.yml); the binary is swapped in the working tree only
      # and never committed.
      - name: Select firmware
        id: firmware
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ vars.VITE_LATEST_FIRMWARE_VERSION }}"
          if [ "$IS_DEV" = "true" ] && gh release view firmware-dev --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download firmware-dev --repo "${{ github.repository }}"               -p esp32-latest.bin -p version.txt -D "$RUNNER_TEMP/firmware" --clobber
            cp "$RUNNER_TEMP/firmware/esp32-latest.bin" packages/web/public/firmware/esp32-latest.bin
            VERSION=$(tr -d '[:space:]' < "$RUNNER_TEMP/firmware/version.txt")
            echo "Using dev firmware v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Images are pushed under their version and commit tags only. Coolify
      # pulls the channel tag (:latest for production, :dev for development),
      # which is moved onto these images further down, once the release commit
      # exists and (for the server) migrations have run.
      - name: Build and push web image
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ steps.images.outputs.web }}:v${{ steps.appversion.outputs.version }}
            ${{ steps.images.outputs.web }}:sha-${{ github.sha }}
          # The image is public, so deployment config (Neon URLs, Rollbar
          # token, app env) comes from the container's environment in Coolify
          # at start-up instead. Only the firmware version, which describes the
          # binary baked into the image, is a build arg.
          build-args: |
            VITE_LATEST_FIRMWARE_VERSION=${{ steps.firmware.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push server image
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ steps.images.outputs.server }}:v${{ steps.appversion.outputs.version }}
            ${{ steps.images.outputs.server }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push API docs image
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-docs
          push: true
          tags: |
            ${{ steps.images.outputs.docs }}:v${{ steps.appversion.outputs.version }}
            ${{ steps.images.outputs.docs }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.API_DOCS_VITE_API_URL }}
          cache-from: type=gha,scope=api-docs
          cache-to: type=gha,mode=max,scope=api-docs

      # Like the server, the bot reads all of its config (token, client id,
      # server URL, secrets) from the container's environment at start-up.
      - name: Build and push bot image
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.bot == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bot
          push: true
          tags: |
            ${{ steps.images.outputs.bot }}:v${{ steps.appversion.outputs.version }}
            ${{ steps.images.outputs.bot }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Commit and tag app version
        id: appcommit
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.partial != 'true' && env.IS_DEV != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/web/package.json packages/server/package.json packages/shared/package.json packages/api-docs/package.json packages/bot/package.json packages/api-docs/public/openapi.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): v${{ steps.appversion.outputs.version }} [skip ci]"
            git tag "v${{ steps.appversion.outputs.version }}"
            git push
            git push origin "v${{ steps.appversion.outputs.version }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Shows an in-app banner while the deploy runs. Non-fatal: a failure
      # here must never block the deploy itself. The announcement expires on
      # its own (durationMinutes) if the removal step below never runs.
      - name: Announce deploy
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        continue-on-error: true
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          curl -sf --max-time 15 -X POST "$API_URL/announcements/deploy" \
            -H "X-Deploy-Key: $DEPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"durationMinutes": 60}'

      - name: Promote web, API docs and bot images
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          promote() {
            docker buildx imagetools create -t "$1:$CHANNEL" "$1:v${{ steps.appversion.outputs.version }}"
          }
          if [ "${{ steps.targets.outputs.web_server }}" = "true" ]; then promote "${{ steps.images.outputs.web }}"; fi
          if [ "${{ steps.targets.outputs.docs }}" = "true" ]; then promote "${{ steps.images.outputs.docs }}"; fi
          if [ "${{ steps.targets.outputs.bot }}" = "true" ]; then promote "${{ steps.images.outputs.bot }}"; fi

      - name: Trigger Coolify deployment (web)
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify deployment (API docs)
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API_DOCS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_API_DOCS isn't set, skipping the API docs deploy."
            exit 0
          fi
          curl -sf --request POST "$WEBHOOK" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify deployment (bot)
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.bot == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BOT }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_BOT isn't set, skipping the bot deploy."
            exit 0
          fi
          curl -sf --request POST "$WEBHOOK" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Install server dependencies
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        run: pnpm install --frozen-lockfile --filter @magic-vault/server...

      - name: Run database migrations
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @magic-vault/server db:migrate

      - name: Promote server image
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.images.outputs.server }}:$CHANNEL" \
            "${{ steps.images.outputs.server }}:v${{ steps.appversion.outputs.version }}"

      - name: Trigger Coolify deployment (server)
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_SERVER }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # The Coolify webhook returns as soon as the deploy is queued, so the
      # deploy only counts as finished once the server reports the new
      # version.
      - name: Wait for new server version
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          EXPECTED: ${{ steps.appversion.outputs.version }}
        run: |
          until [ "$(curl -sf --max-time 10 "$API_URL/public/version" | jq -r '.data.version' 2>/dev/null)" = "$EXPECTED" ]; do
            echo "Waiting for server v$EXPECTED..."
            sleep 15
          done
          echo "Server is running v$EXPECTED"

      - name: Remove deploy announcement
        if: always() && steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true'
        continue-on-error: true
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf --max-time 15 -X DELETE "$API_URL/announcements/deploy" \
              -H "X-Deploy-Key: $DEPLOY_API_KEY"; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Notify Discord (success)
        if: success() && steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true' && env.IS_DEV != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_DEPLOYMENTS_ROLE_ID }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
          COMMITS: ${{ steps.changes.outputs.commits }}
          AUTHORS: ${{ steps.changes.outputs.authors }}
        run: |
          REDEPLOYED="${{ steps.targets.outputs.labels }}"

          CHANGED="None"
          if [ "${{ steps.changes.outputs.web }}" = "true" ] && [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            CHANGED="Web, Server"
          elif [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            CHANGED="Web"
          elif [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            CHANGED="Server"
          fi

          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          LINK_URL="${PR_URL:-$COMMIT_URL}"

          DESCRIPTION="Mault deployed"
          if [ -n "$COMMITS" ]; then
            DESCRIPTION=$(printf 'Mault deployed\n\n%s' "$(sed 's/^/- /' <<< "$COMMITS")" | cut -c1-3900)
          fi

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$LINK_URL" \
            --arg description "$DESCRIPTION" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg author "${AUTHORS:-${{ github.actor }}}" \
            --arg changed "$CHANGED" \
            --arg redeployed "$REDEPLOYED" \
            --arg version "${{ steps.appversion.outputs.version }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg role_id "$DISCORD_ROLE_ID" \
            '{
              content: ("<@&" + $role_id + ">"),
              allowed_mentions: { roles: [$role_id] },
              embeds: [{
                title: $title,
                description: $description,
                color: 5763719,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Changed", value: $changed, inline: true },
                  { name: "Redeployed", value: $redeployed, inline: true },
                  { name: "Version", value: ($version | if . == "" then "unchanged" else ("v" + .) end), inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Discord (failure)
        if: failure() && steps.targets.outputs.web_server != 'false'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg title "${PR_TITLE:-Mault deploy failed}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                description: "Deploy failed - check the run log.",
                color: 15548997,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
