name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mault.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only meaningful for a push event, which has a "before" commit to
      # diff against - a manually dispatched run always deploys below
      # regardless of what this reports.
      - name: Detect changed packages
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'Dockerfile.web'
            server:
              - 'packages/server/**'
              - 'packages/shared/**'
              - 'drizzle/**'
              - 'Dockerfile.server'

      # Web and server are always deployed together: if only one of them
      # changed, deploying just that one would leave the other running an
      # older version, and the two are expected to stay on the same release.
      # A manual (workflow_dispatch) run always deploys, since the whole
      # point of triggering it by hand is to force a redeploy regardless of
      # what changed - e.g. retrying after a failed Coolify webhook.
      - name: Compute deploy flag
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changes.outputs.web }}" = "true" ] || [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
          TITLE=$(jq -r '.title // empty' <<< "$PR_JSON")
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --format=%s)
          fi
          echo "url=$(jq -r '.html_url // empty' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          {
            echo "title<<PR_TITLE_EOF"
            echo "$TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute app version
        id: appversion
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$CURRENT" | grep -oP '^\d+\.\d+')
          CURRENT_PATCH=$(echo "$CURRENT" | grep -oP '\d+$')
          LAST=$(git tag -l "v${MAJOR_MINOR}.*" | sed -E "s/^v${MAJOR_MINOR}\.//" | sort -n | tail -1)
          LAST="${LAST:-$CURRENT_PATCH}"
          PATCH=$((LAST + 1))
          VERSION="${MAJOR_MINOR}.${PATCH}"
          node scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag app version
        id: appcommit
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/web/package.json packages/server/package.json packages/shared/package.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): v${{ steps.appversion.outputs.version }}"
            git tag "v${{ steps.appversion.outputs.version }}"
            git push
            git push origin "v${{ steps.appversion.outputs.version }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trigger Coolify deployment (web)
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Build server image
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Set up pnpm
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install server dependencies
        if: steps.deploy.outputs.should_deploy == 'true'
        run: pnpm install --frozen-lockfile --filter @magic-vault/server...

      - name: Run database migrations
        if: steps.deploy.outputs.should_deploy == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @magic-vault/server db:migrate

      - name: Trigger Coolify deployment (server)
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_SERVER }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_DEPLOYMENTS_ROLE_ID }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          REDEPLOYED="None"
          if [ "${{ steps.deploy.outputs.should_deploy }}" = "true" ]; then
            REDEPLOYED="Web, Server"
          fi

          CHANGED="None"
          if [ "${{ steps.changes.outputs.web }}" = "true" ] && [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            CHANGED="Web, Server"
          elif [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            CHANGED="Web"
          elif [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            CHANGED="Server"
          fi

          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          LINK_URL="${PR_URL:-$COMMIT_URL}"

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$LINK_URL" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg author "${{ github.actor }}" \
            --arg changed "$CHANGED" \
            --arg redeployed "$REDEPLOYED" \
            --arg version "${{ steps.appversion.outputs.version }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg role_id "$DISCORD_ROLE_ID" \
            '{
              content: ("<@&" + $role_id + ">"),
              allowed_mentions: { roles: [$role_id] },
              embeds: [{
                title: $title,
                description: "Mault deployed",
                color: 5763719,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Changed", value: $changed, inline: true },
                  { name: "Redeployed", value: $redeployed, inline: true },
                  { name: "Version", value: ($version | if . == "" then "unchanged" else ("v" + .) end), inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "${PR_TITLE:-Mault deploy failed}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                description: "Deploy failed - check the run log.",
                color: 15548997,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
