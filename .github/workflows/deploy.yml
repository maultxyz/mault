name: Release

on:
  # Nightly at 19:17 America/Chicago, off the top of the hour since GitHub
  # delays or drops scheduled runs when load peaks at :00. Cron is UTC-only,
  # so both offsets are scheduled and "Compute deploy flag" keeps only the one
  # matching the current CDT/CST offset. Scheduled runs always use the default branch (master), and
  # only deploy when something changed since the last release tag.
  # Dev deploys are manual only (dispatch on dev, or a dev Firmware Release):
  # no release commit or tag, and images move the :dev tag rather than :latest.
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (master only; scheduled runs and dev deploys bump the patch)
        type: choice
        options: [patch, minor, major]
        default: patch
      target:
        description: What to deploy. Anything but everything skips the release commit and tag, so the nightly run still sees the rest as pending.
        type: choice
        options: [everything, web-and-server, bot, api-docs, shortener]
        default: everything
      force:
        description: Deploy every container in the target even when nothing changed since the last release
        type: boolean
        default: false
      deploy_to_coolify:
        description: Deploy to Coolify. Off publishes the release only (version bump, commit, tag, images on the channel tag) and skips the Coolify deploys and database migrations, so the hosted app stays on its current version until a forced deploy.
        type: boolean
        default: true
      rollback_tag:
        description: "Rollback: redeploy this release tag (vX.Y.Z) instead of the branch. Reuses its images, rebuilds any that are missing, and skips the bump, commit, tag and migrations."
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.ref_name == 'dev' && 'dev-release-pipeline' || 'master-release-pipeline' }}
  cancel-in-progress: false

env:
  IS_DEV: ${{ github.ref_name == 'dev' }}
  CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}

# Stages: plan -> build (one job per image) -> release (commit and tag) ->
# deploy apps -> migrate -> deploy server -> notify. A failed stage can be
# re-run on its own ("Re-run failed jobs"): later stages only start once the
# earlier ones succeeded or were skipped, and images are only moved onto the
# channel tags Coolify pulls after every image built.
# With deploy_to_coolify off the run is still a full release for self-hosters
# (bump, commit, tag, channel tags), but nothing is sent to Coolify and no
# migrations run. The release tag then marks that work as released, so the
# nightly run won't deploy it: run a forced deploy to bring the hosted app up
# (that runs the migrations). Until then a manual redeploy in Coolify would
# pull the new images onto the old schema.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.deploy.outputs.should_deploy }}
      coolify: ${{ steps.deploy.outputs.coolify }}
      rollback: ${{ steps.rollback.outputs.active }}
      version: ${{ steps.appversion.outputs.version }}
      sha: ${{ steps.appversion.outputs.sha }}
      partial: ${{ steps.targets.outputs.partial }}
      web_server: ${{ steps.targets.outputs.web_server }}
      docs: ${{ steps.targets.outputs.docs }}
      bot: ${{ steps.targets.outputs.bot }}
      shortener: ${{ steps.targets.outputs.shortener }}
      labels: ${{ steps.targets.outputs.labels }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      title: ${{ steps.pr.outputs.title }}
      url: ${{ steps.pr.outputs.url }}
      changed_web: ${{ steps.changes.outputs.web }}
      changed_server: ${{ steps.changes.outputs.server }}
      authors: ${{ steps.changes.outputs.authors }}
      commits: ${{ steps.changes.outputs.commits }}
      web_image: ${{ steps.images.outputs.web }}
      server_image: ${{ steps.images.outputs.server }}
      docs_image: ${{ steps.images.outputs.docs }}
      bot_image: ${{ steps.images.outputs.bot }}
      shortener_image: ${{ steps.images.outputs.shortener }}
    steps:
      # Dispatching from any other branch would deploy unreleased code to
      # production, so only master and dev are allowed.
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "master" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Deploys run from master (production) or dev (development) only, not ${{ github.ref_name }}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rollback_tag || github.ref }}

      # A rollback deploys a release tag's code under that tag's version. The
      # images were pushed as :v<version> when the tag was released, so they
      # are reused; only the channel tags and Coolify move. Nothing is
      # committed or tagged, so the next nightly run still sees nothing
      # pending and the rollback stays until new work lands or you deploy.
      - name: Resolve rollback
        id: rollback
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [ -z "$ROLLBACK_TAG" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$ROLLBACK_TAG" >/dev/null; then
            echo "::error::$ROLLBACK_TAG is not a release tag (vX.Y.Z)."
            exit 1
          fi
          {
            echo "active=true"
            echo "version=${ROLLBACK_TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Rolling back to $ROLLBACK_TAG ($(git rev-parse --short HEAD))"

      # Every deploy tags its release commit (vX.Y.Z), so everything after the
      # latest tag is what's pending. A manually picked single target or the
      # force input deploys regardless of what this reports.
      - name: Detect pending changes since the last release
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
            FILES=$(git diff --name-only "$LAST_TAG" HEAD)
          else
            RANGE="HEAD"
            FILES=$(git ls-files)
          fi

          WEB=false
          SERVER=false
          DOCS=false
          BOT=false
          SHORTENER=false
          if grep -qE '^(packages/web/|packages/shared/|Dockerfile\.web$|nginx\.conf$|docker/web-env\.sh$)' <<< "$FILES"; then WEB=true; fi
          if grep -qE '^(packages/server/|packages/shared/|drizzle/|Dockerfile\.server$)' <<< "$FILES"; then SERVER=true; fi
          if grep -qE '^(packages/api-docs/|packages/shared/|Dockerfile\.api-docs$)' <<< "$FILES"; then DOCS=true; fi
          if grep -qE '^(packages/bot/|Dockerfile\.bot$)' <<< "$FILES"; then BOT=true; fi
          if grep -qE '^(packages/shortener/|packages/shared/|Dockerfile\.shortener$)' <<< "$FILES"; then SHORTENER=true; fi

          COMMITS=$(git log --no-merges --format='%s' "$RANGE" | grep -v '^chore(release):' || true)
          COUNT=$(grep -c . <<< "$COMMITS" || true)
          AUTHORS=$(git log --no-merges --format='%an' "$RANGE" | sort -u | paste -sd ',' - | sed 's/,/, /g')

          {
            echo "web=$WEB"
            echo "server=$SERVER"
            echo "docs=$DOCS"
            echo "bot=$BOT"
            echo "shortener=$SHORTENER"
            echo "last_tag=$LAST_TAG"
            echo "count=$COUNT"
            echo "authors=$AUTHORS"
            echo "commits<<COMMITS_EOF"
            head -n 15 <<< "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Pending since ${LAST_TAG:-the first commit}: web=$WEB server=$SERVER docs=$DOCS bot=$BOT shortener=$SHORTENER, $COUNT commit(s)"

      # Web and server are always deployed together: if only one of them
      # changed, deploying just that one would leave the other running an
      # older version, and the two are expected to stay on the same release.
      # "everything" only deploys the containers with changes since the last
      # release tag, which still counts as a full release because the others
      # already run that code. Force (and a rollback) makes "everything"
      # deploy every container, changed or not, and still counts as a full
      # release. Picking a single target always deploys it, e.g. to retry
      # after a failed Coolify webhook. A partial deploy is not a release: the
      # version gets a -<target>.<sha> suffix and nothing is committed or
      # tagged, since a tag would mark the parts that were left out as deployed.
      - name: Select deploy targets
        id: targets
        env:
          TARGET: ${{ inputs.target || 'everything' }}
          FORCE: ${{ (inputs.force || inputs.rollback_tag != '') && 'true' || 'false' }}
        run: |
          WEB_SERVER=false
          DOCS=false
          BOT=false
          SHORTENER=false
          case "$TARGET" in
            everything)
              if [ "$FORCE" = "true" ]; then
                WEB_SERVER=true
                DOCS=true
                BOT=true
                SHORTENER=true
              else
                if [ "${{ steps.changes.outputs.web }}" = "true" ] || [ "${{ steps.changes.outputs.server }}" = "true" ]; then WEB_SERVER=true; fi
                DOCS="${{ steps.changes.outputs.docs }}"
                BOT="${{ steps.changes.outputs.bot }}"
                SHORTENER="${{ steps.changes.outputs.shortener }}"
              fi
              ;;
            web-and-server) WEB_SERVER=true ;;
            api-docs) DOCS=true ;;
            bot) BOT=true ;;
            shortener) SHORTENER=true ;;
            *) echo "::error::Unknown deploy target $TARGET."; exit 1 ;;
          esac
          LABELS=()
          if [ "$WEB_SERVER" = "true" ]; then LABELS+=("Web" "Server"); fi
          if [ "$DOCS" = "true" ]; then LABELS+=("API docs"); fi
          if [ "$BOT" = "true" ]; then LABELS+=("Bot"); fi
          if [ "$SHORTENER" = "true" ]; then LABELS+=("Shortener"); fi
          {
            echo "target=$TARGET"
            echo "partial=$([ "$TARGET" = "everything" ] && echo false || echo true)"
            echo "web_server=$WEB_SERVER"
            echo "docs=$DOCS"
            echo "bot=$BOT"
            echo "shortener=$SHORTENER"
            echo "labels=$(IFS=,; echo "${LABELS[*]}" | sed 's/,/, /g')"
            echo "any=$([ ${#LABELS[@]} -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $TARGET (${LABELS[*]:-nothing changed})"

      - name: Compute deploy flag
        id: deploy
        run: |
          echo "coolify=${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_to_coolify == false) && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
          if [ "$(TZ=America/Chicago date +%Z)" = "CDT" ]; then
            EXPECTED_CRON="17 0 * * *"
          else
            EXPECTED_CRON="17 1 * * *"
          fi
          if [ "${{ steps.targets.outputs.any }}" != "true" ]; then
            echo "Skipping: nothing to deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$EXPECTED_CRON" ]; then
            echo "Skipping: ${{ github.event.schedule }} is not 19:17 America/Chicago today"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Describe release
        id: pr
        run: |
          if [ "${{ steps.rollback.outputs.active }}" = "true" ]; then
            TITLE="Rollback to ${{ inputs.rollback_tag }}"
          elif [ "$IS_DEV" = "true" ]; then
            TITLE="Dev deploy"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TITLE="Manual deploy"
          else
            TITLE="Nightly deploy (${{ steps.changes.outputs.count }} commits)"
          fi
          if [ "${{ steps.targets.outputs.partial }}" = "true" ]; then
            TITLE="$TITLE (${{ steps.targets.outputs.labels }})"
          elif [ "${{ inputs.force }}" = "true" ]; then
            TITLE="$TITLE (forced)"
          fi
          if [ "${{ steps.deploy.outputs.coolify }}" != "true" ]; then
            TITLE="$TITLE (images only, not deployed)"
          fi
          if [ -n "${{ steps.changes.outputs.last_tag }}" ]; then
            URL="https://github.com/${{ github.repository }}/compare/${{ steps.changes.outputs.last_tag }}...${{ github.sha }}"
          else
            URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "title<<PR_TITLE_EOF"
            echo "$TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      # The version is bumped and the OpenAPI spec regenerated in the working
      # tree before the images are built, so the images carry the release
      # version; the changed files travel to the later stages as the
      # release-overlay artifact. Nothing is committed or tagged until every
      # image is pushed, so a failed build never leaves a tag behind that makes
      # the next nightly run think nothing is pending. Dev builds keep the
      # current version with a -dev.<sha> suffix, so the web app's version
      # check and the wait step below still see each dev deploy as a new version.
      - name: Compute app version
        id: appversion
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.rollback.outputs.active }}" = "true" ]; then
            echo "version=${{ steps.rollback.outputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$IS_DEV" = "true" ]; then
            VERSION="${CURRENT}-dev.${GITHUB_SHA::7}"
          elif [ "${{ steps.targets.outputs.partial }}" = "true" ]; then
            VERSION="${CURRENT}-${{ steps.targets.outputs.target }}.${GITHUB_SHA::7}"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            case "${{ inputs.bump || 'patch' }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)
                MAJOR_MINOR="${MAJOR}.${MINOR}"
                CURRENT_PATCH=$(echo "$CURRENT" | grep -oP '\d+$')
                LAST=$(git tag -l "v${MAJOR_MINOR}.*" | grep -E "^v${MAJOR_MINOR}\.[0-9]+$" | sed -E "s/^v${MAJOR_MINOR}\.//" | sort -n | tail -1)
                LAST="${LAST:-$CURRENT_PATCH}"
                if [ "$CURRENT_PATCH" -gt "$LAST" ]; then LAST="$CURRENT_PATCH"; fi
                VERSION="${MAJOR_MINOR}.$((LAST + 1))"
                ;;
            esac
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists."
              exit 1
            fi
          fi
          node scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true' && steps.rollback.outputs.active != 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true' && steps.rollback.outputs.active != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # The API reference site serves this file as-is, so the spec is
      # regenerated here (with the new version), baked into the API docs image
      # and committed with the release rather than generated at build time.
      - name: Generate OpenAPI spec
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.docs == 'true' && steps.rollback.outputs.active != 'true'
        run: |
          pnpm install --frozen-lockfile --filter @magic-vault/api-docs...
          pnpm --filter @magic-vault/api-docs openapi

      # Dev deploys flash the firmware-dev pre-release when one exists (see
      # firmware-release.yml); the binary and the sketch's version are swapped
      # in the working tree only and never committed. The server reports the
      # version from the sketch copied into its image.
      - name: Select firmware
        if: steps.deploy.outputs.should_deploy == 'true' && steps.targets.outputs.web_server == 'true' && steps.rollback.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IS_DEV" = "true" ] && gh release view firmware-dev --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download firmware-dev --repo "${{ github.repository }}" -p esp32-latest.bin -p version.txt -D "$RUNNER_TEMP/firmware" --clobber
            cp "$RUNNER_TEMP/firmware/esp32-latest.bin" packages/web/public/firmware/esp32-latest.bin
            VERSION=$(tr -d '[:space:]' < "$RUNNER_TEMP/firmware/version.txt")
            sed -i "s/#define FIRMWARE_VERSION \"[^\"]*\"/#define FIRMWARE_VERSION \"$VERSION\"/" firmware/main/main.ino
            echo "Using dev firmware v$VERSION"
          fi

      - name: Pack release overlay
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          git diff --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/release-overlay.tgz"
          echo "Overlay files:"
          git diff --name-only

      - name: Upload release overlay
        if: steps.deploy.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-overlay
          path: ${{ runner.temp }}/release-overlay.tgz
          retention-days: 7

      - name: Compute image names
        id: images
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          PREFIX="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/mault"
          {
            echo "web=$PREFIX-web"
            echo "server=$PREFIX-server"
            echo "docs=$PREFIX-api-docs"
            echo "bot=$PREFIX-bot"
            echo "shortener=$PREFIX-shortener"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.deploy.outputs.should_deploy == 'true' && steps.rollback.outputs.active == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build job per selected image. A rollback skips images that were
      # already pushed under its version; containers that didn't change in
      # the tag's release have none, so those are rebuilt from the tag.
      - name: Plan image builds
        id: matrix
        if: steps.deploy.outputs.should_deploy == 'true'
        run: |
          VERSION="${{ steps.appversion.outputs.version }}"
          ENTRIES='[]'
          add() {
            local name="$1" selected="$2" dockerfile="$3" image="$4"
            [ "$selected" = "true" ] || return 0
            if [ "${{ steps.rollback.outputs.active }}" = "true" ] && docker buildx imagetools inspect "$image:v$VERSION" >/dev/null 2>&1; then
              echo "Reusing $image:v$VERSION"
              return 0
            fi
            ENTRIES=$(jq -c --arg name "$name" --arg dockerfile "$dockerfile" --arg image "$image" \
              '. + [{name: $name, dockerfile: $dockerfile, image: $image}]' <<< "$ENTRIES")
          }
          add web "${{ steps.targets.outputs.web_server }}" Dockerfile.web "${{ steps.images.outputs.web }}"
          add server "${{ steps.targets.outputs.web_server }}" Dockerfile.server "${{ steps.images.outputs.server }}"
          add api-docs "${{ steps.targets.outputs.docs }}" Dockerfile.api-docs "${{ steps.images.outputs.docs }}"
          add bot "${{ steps.targets.outputs.bot }}" Dockerfile.bot "${{ steps.images.outputs.bot }}"
          add shortener "${{ steps.targets.outputs.shortener }}" Dockerfile.shortener "${{ steps.images.outputs.shortener }}"
          echo "build_matrix=$(jq -c '{include: .}' <<< "$ENTRIES")" >> "$GITHUB_OUTPUT"
          echo "Images to build: $(jq -r 'map(.name) | join(", ")' <<< "$ENTRIES")"

  # Images are pushed under their version and commit tags only. Coolify pulls
  # the channel tag (:latest for production, :dev for development), which the
  # deploy stages move onto these images once every image is built.
  build:
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.build_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Download release overlay
        uses: actions/download-artifact@v4
        with:
          name: release-overlay
          path: ${{ runner.temp }}

      - name: Apply release overlay
        run: tar -xzf "$RUNNER_TEMP/release-overlay.tgz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web, server, bot and shortener images are public and read their
      # config (Neon URLs, tokens, secrets, Better Stack DSN) from the
      # container's environment in Coolify at start-up. Only the API docs bake
      # in the API URL.
      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:v${{ needs.plan.outputs.version }}
            ${{ matrix.image }}:sha-${{ needs.plan.outputs.sha }}
          build-args: ${{ matrix.name == 'api-docs' && format('VITE_API_URL={0}', vars.API_DOCS_VITE_API_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: [plan, build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.partial != 'true' && needs.plan.outputs.rollback != 'true' && github.ref_name != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release overlay
        uses: actions/download-artifact@v4
        with:
          name: release-overlay
          path: ${{ runner.temp }}

      - name: Commit and tag app version
        run: |
          tar -xzf "$RUNNER_TEMP/release-overlay.tgz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/web/package.json packages/server/package.json packages/shared/package.json packages/api-docs/package.json packages/bot/package.json packages/shortener/package.json packages/api-docs/public/openapi.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(release): v${{ needs.plan.outputs.version }} [skip ci]"
            git tag "v${{ needs.plan.outputs.version }}"
            git push --atomic origin HEAD "refs/tags/v${{ needs.plan.outputs.version }}"
          fi

  deploy-apps:
    needs: [plan, build, release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ vars.APP_URL }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Shows an in-app banner while the deploy runs. Non-fatal: a failure
      # here must never block the deploy itself. The announcement expires on
      # its own (durationMinutes) if the notify stage never removes it.
      - name: Announce deploy
        if: needs.plan.outputs.web_server == 'true' && needs.plan.outputs.coolify == 'true'
        continue-on-error: true
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          curl -sf --max-time 15 -X POST "$API_URL/announcements/deploy" \
            -H "X-Deploy-Key: $DEPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"durationMinutes": 60}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote web, API docs, bot and shortener images
        run: |
          promote() {
            docker buildx imagetools create -t "$1:$CHANNEL" "$1:v$VERSION"
          }
          if [ "${{ needs.plan.outputs.web_server }}" = "true" ]; then promote "${{ needs.plan.outputs.web_image }}"; fi
          if [ "${{ needs.plan.outputs.docs }}" = "true" ]; then promote "${{ needs.plan.outputs.docs_image }}"; fi
          if [ "${{ needs.plan.outputs.bot }}" = "true" ]; then promote "${{ needs.plan.outputs.bot_image }}"; fi
          if [ "${{ needs.plan.outputs.shortener }}" = "true" ]; then promote "${{ needs.plan.outputs.shortener_image }}"; fi

      - name: Trigger Coolify deployment (web)
        if: needs.plan.outputs.web_server == 'true' && needs.plan.outputs.coolify == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify deployment (API docs)
        if: needs.plan.outputs.docs == 'true' && needs.plan.outputs.coolify == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API_DOCS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_API_DOCS isn't set, skipping the API docs deploy."
            exit 0
          fi
          curl -sf --request POST "$WEBHOOK" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify deployment (bot)
        if: needs.plan.outputs.bot == 'true' && needs.plan.outputs.coolify == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BOT }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_BOT isn't set, skipping the bot deploy."
            exit 0
          fi
          curl -sf --request POST "$WEBHOOK" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # Deployed before the server so new short links can be registered as
      # soon as the new API starts.
      - name: Trigger Coolify deployment (shortener)
        if: needs.plan.outputs.shortener == 'true' && needs.plan.outputs.coolify == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_SHORTENER }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_SHORTENER isn't set, skipping the shortener deploy."
            exit 0
          fi
          curl -sf --request POST "$WEBHOOK" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  # Migrations only move forward, so a rollback skips this stage and runs the
  # older server against the newer schema.
  migrate:
    needs: [plan, deploy-apps]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.web_server == 'true' && needs.plan.outputs.rollback != 'true' && needs.plan.outputs.coolify == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile --filter @magic-vault/server...

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @magic-vault/server db:migrate

  deploy-server:
    needs: [plan, deploy-apps, migrate]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.web_server == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ vars.APP_URL }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote server image
        run: |
          docker buildx imagetools create \
            -t "${{ needs.plan.outputs.server_image }}:$CHANNEL" \
            "${{ needs.plan.outputs.server_image }}:v${{ needs.plan.outputs.version }}"

      - name: Trigger Coolify deployment (server)
        if: needs.plan.outputs.coolify == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_SERVER }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # The Coolify webhook returns as soon as the deploy is queued, so the
      # deploy only counts as finished once the server reports the new
      # version.
      - name: Wait for new server version
        if: needs.plan.outputs.coolify == 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          until [ "$(curl -sf --max-time 10 "$API_URL/public/version" | jq -r '.data.version' 2>/dev/null)" = "$EXPECTED" ]; do
            echo "Waiting for server v$EXPECTED..."
            sleep 15
          done
          echo "Server is running v$EXPECTED"

  notify:
    needs: [plan, build, release, deploy-apps, migrate, deploy-server]
    if: ${{ always() && (needs.plan.outputs.should_deploy == 'true' || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    env:
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Remove deploy announcement
        if: needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.web_server == 'true' && needs.plan.outputs.coolify == 'true'
        continue-on-error: true
        env:
          API_URL: ${{ secrets.MAULT_API_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf --max-time 15 -X DELETE "$API_URL/announcements/deploy" \
              -H "X-Deploy-Key: $DEPLOY_API_KEY"; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Notify Discord (success)
        if: env.FAILED != 'true' && needs.plan.outputs.should_deploy == 'true' && needs.plan.outputs.web_server == 'true' && needs.plan.outputs.coolify == 'true' && github.ref_name != 'dev'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_DEPLOYMENTS_ROLE_ID }}
          PR_TITLE: ${{ needs.plan.outputs.title }}
          PR_URL: ${{ needs.plan.outputs.url }}
          COMMITS: ${{ needs.plan.outputs.commits }}
          AUTHORS: ${{ needs.plan.outputs.authors }}
        run: |
          REDEPLOYED="${{ needs.plan.outputs.labels }}"

          CHANGED="None"
          if [ "${{ needs.plan.outputs.changed_web }}" = "true" ] && [ "${{ needs.plan.outputs.changed_server }}" = "true" ]; then
            CHANGED="Web, Server"
          elif [ "${{ needs.plan.outputs.changed_web }}" = "true" ]; then
            CHANGED="Web"
          elif [ "${{ needs.plan.outputs.changed_server }}" = "true" ]; then
            CHANGED="Server"
          fi

          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          LINK_URL="${PR_URL:-$COMMIT_URL}"

          DESCRIPTION="Mault deployed"
          if [ -n "$COMMITS" ]; then
            DESCRIPTION=$(printf 'Mault deployed\n\n%s' "$(sed 's/^/- /' <<< "$COMMITS")" | cut -c1-3900)
          fi

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$LINK_URL" \
            --arg description "$DESCRIPTION" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg author "${AUTHORS:-${{ github.actor }}}" \
            --arg changed "$CHANGED" \
            --arg redeployed "$REDEPLOYED" \
            --arg version "${{ needs.plan.outputs.version }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg role_id "$DISCORD_ROLE_ID" \
            '{
              content: ("<@&" + $role_id + ">"),
              allowed_mentions: { roles: [$role_id] },
              embeds: [{
                title: $title,
                description: $description,
                color: 5763719,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Changed", value: $changed, inline: true },
                  { name: "Redeployed", value: $redeployed, inline: true },
                  { name: "Version", value: ($version | if . == "" then "unchanged" else ("v" + .) end), inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Discord (failure)
        if: env.FAILED == 'true' && needs.plan.outputs.web_server != 'false'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          PR_TITLE: ${{ needs.plan.outputs.title }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg title "${PR_TITLE:-Mault deploy failed}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                description: "Deploy failed - check the run log.",
                color: 15548997,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
