name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, ios, android]
        default: all
      bump:
        description: Version bump (master only; dev builds keep the current version)
        type: choice
        options: [patch, minor, major]
        default: patch
      submit:
        description: Submit master builds to App Store Connect and Google Play (dev builds are never submitted)
        type: boolean
        default: true
      android_track:
        description: Google Play track for the Android submission
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: write

# Builds run on EAS, and this job waits for them (often 20+ minutes), so it
# gets its own group instead of holding up web deploys and firmware releases.
concurrency:
  group: mobile-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    env:
      IS_DEV: ${{ github.ref_name == 'dev' }}
      PROFILE: ${{ github.ref_name == 'dev' && 'preview' || 'production' }}
      PLATFORM: ${{ inputs.platform }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      SUBMIT: ${{ github.ref_name == 'master' && inputs.submit }}
      ANDROID_TRACK: ${{ inputs.android_track }}
      IOS_ASC_APP_ID: ${{ vars.IOS_ASC_APP_ID }}
    steps:
      # master builds go to the stores, dev builds are internal install links.
      # Anything else would ship unreleased code, so it's refused.
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "master" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Mobile releases run from master (stores) or dev (internal), not ${{ github.ref_name }}."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the EAS_PROJECT_ID variable in this GitHub environment (expo.dev > project > Project ID)."
            exit 1
          fi
          if [ "$SUBMIT" = "true" ] && [ "$PLATFORM" != "android" ] && [ -z "$IOS_ASC_APP_ID" ]; then
            echo "::error::Set the IOS_ASC_APP_ID variable in this GitHub environment (App Store Connect > App Information > Apple ID), or run with submit off."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The store version is packages/mobile's own version, separate from the
      # web/server release version. Build numbers are managed remotely by EAS
      # (appVersionSource: remote, autoIncrement on production). iOS only
      # accepts plain X.Y.Z, so dev builds reuse the current version.
      - name: Compute app version
        id: version
        working-directory: packages/mobile
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$IS_DEV" = "true" ]; then
            VERSION="$CURRENT"
          else
            VERSION=$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const bump = process.argv[2];
              console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`);
            ' "$CURRENT" "${{ inputs.bump }}")
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf-8"));
              pkg.version = process.argv[1];
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            ' "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: packages/mobile
        run: |
          cp eas.example.json eas.json
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --json > "$RUNNER_TEMP/eas-builds.json"

      # Only after the builds succeed: a failed run leaves no version bump.
      - name: Commit and tag mobile version
        if: env.IS_DEV != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packages/mobile/package.json
          git commit -m "chore(release): mobile v$VERSION [skip ci]"
          git tag "mobile-v$VERSION"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "mobile-v$VERSION"

      # After the version commit: the builds already carry the new version, so
      # a failed submission is retried with eas submit, not a new release.
      # Store credentials (App Store Connect API key, Play service account) are
      # the ones stored on EAS for this project; only the app's ASC id is needed
      # here, and it comes from GitHub, never the committed eas.example.json.
      - name: Submit to stores
        if: env.SUBMIT == 'true'
        working-directory: packages/mobile
        run: |
          jq \
            --arg ascAppId "$IOS_ASC_APP_ID" \
            --arg track "$ANDROID_TRACK" \
            '.submit.production.ios = { ascAppId: $ascAppId }
            | .submit.production.android = { track: $track, releaseStatus: "completed" }' \
            eas.example.json > eas.json
          jq -r '.[] | "\(.platform | ascii_downcase) \(.id)"' "$RUNNER_TEMP/eas-builds.json" | while read -r BUILD_PLATFORM BUILD_ID; do
            eas submit --platform "$BUILD_PLATFORM" --profile production --id "$BUILD_ID" --non-interactive --wait
          done

      - name: Summary
        run: |
          {
            echo "## Mobile ${{ env.IS_DEV == 'true' && 'dev build' || 'release' }} v${{ steps.version.outputs.version }}"
            echo ""
            echo "- Platform: $PLATFORM"
            echo "- EAS profile: $PROFILE"
            echo ""
            jq -r '.[] | "- \(.platform): [build page](https://expo.dev/accounts/\(.project.ownerAccount.name)/projects/\(.project.slug)/builds/\(.id)), [download](\(.artifacts.buildUrl))"' "$RUNNER_TEMP/eas-builds.json"
            if [ "$SUBMIT" = "true" ]; then
              echo ""
              echo "Submitted to the stores: iOS to App Store Connect (TestFlight, send it for review there), Android to the Google Play \`$ANDROID_TRACK\` track."
            elif [ "$IS_DEV" != "true" ]; then
              echo ""
              echo "Not submitted: run \`eas submit --platform <ios|android> --profile production --id <build id>\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
