name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

# Builds run on EAS, and this job waits for them (often 20+ minutes), so it
# gets its own group instead of holding up web deploys and firmware releases.
concurrency:
  group: mobile-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    env:
      IS_DEV: ${{ github.ref_name == 'dev' }}
      PROFILE: ${{ github.ref_name == 'dev' && 'preview' || 'production' }}
      PLATFORM: ${{ inputs.platform }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      # master builds are for the stores, dev builds are internal install links.
      # Anything else would ship unreleased code, so it's refused.
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "master" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Mobile releases run from master (stores) or dev (internal), not ${{ github.ref_name }}."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the EAS_PROJECT_ID variable in this GitHub environment (expo.dev > project > Project ID)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The store version is packages/mobile's package.json version, changed by hand
      # (never bumped here). Build numbers are managed remotely by EAS
      # (appVersionSource: remote, autoIncrement on production).
      - name: Read app version
        id: version
        working-directory: packages/mobile
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: packages/mobile
        run: |
          cp eas.example.json eas.json
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --json > "$RUNNER_TEMP/eas-builds.json"

      - name: Summary
        run: |
          {
            echo "## Mobile ${{ env.IS_DEV == 'true' && 'dev build' || 'release' }} v${{ steps.version.outputs.version }}"
            echo ""
            echo "- Platform: $PLATFORM"
            echo "- EAS profile: $PROFILE"
            echo ""
            jq -r '.[] | "- \(.platform): [build page](https://expo.dev/accounts/\(.project.ownerAccount.name)/projects/\(.project.slug)/builds/\(.id)), [download](\(.artifacts.buildUrl))"' "$RUNNER_TEMP/eas-builds.json"
            if [ "$IS_DEV" != "true" ]; then
              echo ""
              echo "Submit manually: \`eas submit --platform <ios|android> --profile production --id <build id>\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
