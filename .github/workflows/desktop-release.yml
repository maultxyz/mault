name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (master only; dev builds use the current version plus the run number)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      release-tag: ${{ steps.channel.outputs.release-tag }}
      artifact-prefix: ${{ steps.channel.outputs.artifact-prefix }}
    steps:
      # master publishes the production app (desktop-latest); dev publishes the
      # separately installed MAULT Dev app (desktop-dev) that loads dev.mault.xyz.
      - name: Pick channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            master)
              echo "channel=production" >> "$GITHUB_OUTPUT"
              echo "release-tag=desktop-latest" >> "$GITHUB_OUTPUT"
              echo "artifact-prefix=MAULT" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "channel=development" >> "$GITHUB_OUTPUT"
              echo "release-tag=desktop-dev" >> "$GITHUB_OUTPUT"
              echo "artifact-prefix=MAULT-Dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Desktop releases run from master or dev, not ${{ github.ref_name }}."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute app version
        id: version
        working-directory: packages/desktop
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${{ steps.channel.outputs.channel }}" = "development" ]; then
            VERSION="$CURRENT-dev.${{ github.run_number }}"
          else
            VERSION=$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const bump = process.argv[2];
              console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`);
            ' "$CURRENT" "${{ inputs.bump }}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Set up .NET for the scanner helper
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @magic-vault/desktop...

      - name: Set app version
        working-directory: packages/desktop
        shell: bash
        run: npm pkg set version="${{ needs.version.outputs.version }}"

      # Windows signing runs only when these secrets exist; without them the
      # installer is unsigned and SmartScreen warns on first run.
      # MAULT_DESKTOP_CHANNEL is read by both tsup (app URL, app ID, icon) and
      # electron-builder.config.js (installer name, app ID, update feed).
      - name: Build
        working-directory: packages/desktop
        shell: bash
        env:
          MAULT_DESKTOP_CHANNEL: ${{ needs.version.outputs.channel }}
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: pnpm dist --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/dev*.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      RELEASE_TAG: ${{ needs.version.outputs.release-tag }}
      ARTIFACT_PREFIX: ${{ needs.version.outputs.artifact-prefix }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The release tag is the fixed URL electron-updater reads (the generic
      # provider in electron-builder.config.js), so it is replaced on every release.
      - name: Publish release
        run: |
          cp installers/"$ARTIFACT_PREFIX"-*-win-*.exe installers/"$ARTIFACT_PREFIX"-windows.exe
          cp installers/"$ARTIFACT_PREFIX"-*-linux-*.AppImage installers/"$ARTIFACT_PREFIX"-linux.AppImage
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          if [ "$CHANNEL" = "development" ]; then
            gh release create "$RELEASE_TAG" installers/* \
              --target "${{ github.sha }}" \
              --title "MAULT Desktop Dev v$VERSION" \
              --notes "Development build of the MAULT desktop app from ${{ github.sha }}. It installs as MAULT Dev next to the production app and loads dev.mault.xyz." \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" installers/* \
              --title "MAULT Desktop v$VERSION" \
              --notes "MAULT desktop app v$VERSION." \
              --latest=false
          fi

      - name: Commit and tag desktop version
        if: needs.version.outputs.channel == 'production'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          npm pkg set version="$VERSION" --prefix packages/desktop
          git add packages/desktop/package.json
          git commit -m "chore(release): desktop v$VERSION [skip ci]"
          git tag "desktop-v$VERSION"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "desktop-v$VERSION"

      - name: Summary
        run: |
          {
            echo "## Desktop $CHANNEL release v$VERSION"
            echo ""
            echo "- Downloads: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
