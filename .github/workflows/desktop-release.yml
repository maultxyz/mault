name: Desktop Release

# Runs nightly on master and can be dispatched by hand. A nightly run with no
# change to the desktop shell since the last desktop release ends green without
# building, so installed apps are not sent an update that changes nothing.
on:
  # 04:37 UTC, after the nightly Release and off the top of the hour since
  # GitHub delays or drops scheduled runs when load peaks at :00. Scheduled
  # runs always use master and bump the patch.
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (master only; nightly runs bump the patch, dev builds use the current version plus the run number)
        type: choice
        options: [patch, minor, major]
        default: patch
      rollback_tag:
        description: "Rollback: build this desktop tag (desktop-vX.Y.Z) instead of the branch, as the next version so installed apps update to it"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
      channel: ${{ steps.channel.outputs.channel }}
      release-tag: ${{ steps.channel.outputs.release-tag }}
      artifact-prefix: ${{ steps.channel.outputs.artifact-prefix }}
      should-release: ${{ steps.changes.outputs.should-release }}
    steps:
      # master publishes the production app (desktop-latest); dev publishes the
      # separately installed Mault Dev app (desktop-dev) that loads dev.mault.xyz.
      - name: Pick channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            master)
              echo "channel=production" >> "$GITHUB_OUTPUT"
              echo "release-tag=desktop-latest" >> "$GITHUB_OUTPUT"
              echo "artifact-prefix=MAULT" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "channel=development" >> "$GITHUB_OUTPUT"
              echo "release-tag=desktop-dev" >> "$GITHUB_OUTPUT"
              echo "artifact-prefix=MAULT-Dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Desktop releases run from master or dev, not ${{ github.ref_name }}."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The shell is packages/desktop plus the desktop bridge types and
      # constants in shared; the web app it loads is deployed separately. The
      # comparison starts at the last desktop release commit, not its tag: a
      # rollback tags older code, and the nightly run must not ship the branch
      # again until the shell changes after that rollback.
      - name: Check for desktop changes
        id: changes
        run: |
          SHOULD_RELEASE=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_RELEASE_COMMIT=$(git log -1 --format=%H --grep='^chore(release): desktop v' -- packages/desktop/package.json)
            if [ -n "$LAST_RELEASE_COMMIT" ] && git diff --quiet "$LAST_RELEASE_COMMIT" HEAD -- packages/desktop ':(glob)packages/shared/src/**/desktop*'; then
              SHOULD_RELEASE=false
              echo "::notice::The desktop shell has not changed since the last desktop release. Nothing to release."
              echo "## Desktop release skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "The desktop shell has not changed since the last desktop release." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "should-release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      # electron-updater never installs a lower version, so a rollback ships
      # the tag's code under the next version from the branch.
      - name: Resolve source
        id: source
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [ -z "$ROLLBACK_TAG" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$ROLLBACK_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$ROLLBACK_TAG" >/dev/null; then
            echo "::error::$ROLLBACK_TAG is not a desktop release tag (desktop-vX.Y.Z)."
            exit 1
          fi
          echo "sha=$(git rev-parse "$ROLLBACK_TAG^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Compute app version
        id: version
        working-directory: packages/desktop
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${{ steps.channel.outputs.channel }}" = "development" ]; then
            VERSION="$CURRENT-dev.${{ github.run_number }}"
          else
            VERSION=$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const bump = process.argv[2];
              console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`);
            ' "$CURRENT" "${{ inputs.bump }}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.should-release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source-sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Set up .NET for the scanner helper
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @magic-vault/desktop...

      - name: Set app version
        working-directory: packages/desktop
        shell: bash
        run: npm pkg set version="${{ needs.version.outputs.version }}"

      # Windows signing runs only when these secrets exist; without them the
      # installer is unsigned and SmartScreen warns on first run.
      # MAULT_DESKTOP_CHANNEL is read by both tsup (app URL, app ID, icon) and
      # electron-builder.config.js (installer name, app ID, update feed).
      # The app ID is a repository variable so forks never ship under ours, and
      # the update feed follows GITHUB_REPOSITORY.
      - name: Check app ID
        shell: bash
        env:
          MAULT_DESKTOP_APP_ID: ${{ vars.DESKTOP_APP_ID }}
        run: |
          if [ -z "$MAULT_DESKTOP_APP_ID" ]; then
            echo "::error::Set the DESKTOP_APP_ID variable (your own reverse-domain app ID) in the production GitHub environment."
            exit 1
          fi

      - name: Build
        working-directory: packages/desktop
        shell: bash
        env:
          MAULT_DESKTOP_CHANNEL: ${{ needs.version.outputs.channel }}
          MAULT_DESKTOP_APP_ID: ${{ vars.DESKTOP_APP_ID }}
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: pnpm dist --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/dev*.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      RELEASE_TAG: ${{ needs.version.outputs.release-tag }}
      ARTIFACT_PREFIX: ${{ needs.version.outputs.artifact-prefix }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The release tag is the fixed URL electron-updater reads (the generic
      # provider in electron-builder.config.js), so it is replaced on every release.
      - name: Publish release
        run: |
          cp installers/"$ARTIFACT_PREFIX"-*-win-*.exe installers/"$ARTIFACT_PREFIX"-windows.exe
          cp installers/"$ARTIFACT_PREFIX"-*-linux-*.AppImage installers/"$ARTIFACT_PREFIX"-linux.AppImage
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          if [ "$CHANNEL" = "development" ]; then
            gh release create "$RELEASE_TAG" installers/* \
              --target "$SOURCE_SHA" \
              --title "Mault Desktop Dev v$VERSION" \
              --notes "Development build of the Mault desktop app from ${{ github.sha }}. It installs as Mault Dev next to the production app and loads dev.mault.xyz." \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" installers/* \
              --target "$SOURCE_SHA" \
              --title "Mault Desktop v$VERSION" \
              --notes "Mault desktop app v$VERSION." \
              --latest=false
          fi

      - name: Commit and tag desktop version
        if: needs.version.outputs.channel == 'production'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          npm pkg set version="$VERSION" --prefix packages/desktop
          git add packages/desktop/package.json
          git commit -m "chore(release): desktop v$VERSION [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          if [ -n "${{ inputs.rollback_tag }}" ]; then
            git tag "desktop-v$VERSION" "$SOURCE_SHA"
          else
            git tag "desktop-v$VERSION"
          fi
          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/desktop-v$VERSION"

      - name: Summary
        run: |
          {
            echo "## Desktop $CHANNEL release v$VERSION"
            echo ""
            if [ -n "${{ inputs.rollback_tag }}" ]; then
              echo "- Rollback: built from ${{ inputs.rollback_tag }} (\`${SOURCE_SHA::7}\`)"
            fi
            echo "- Downloads: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [version, build, publish]
    if: always() && github.ref_name != 'dev'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Notify Discord (success)
        if: needs.publish.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg version "${{ needs.version.outputs.version }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.release-tag }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Desktop v" + $version + " released (Windows + Linux)"),
                  url: $url,
                  color: 5763719,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (failure)
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: "Desktop build failed",
                  description: "Check the run log.",
                  url: $url,
                  color: 15548997,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"
