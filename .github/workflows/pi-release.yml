name: Pi Release

on:
  schedule:
    - cron: "17 4 * * 1-6"
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      image:
        description: Also build the SD card image (for the release pi-latest points at when this app version is already released)
        type: boolean
        default: true
      rollback_tag:
        description: "Rollback (master only): point pi-latest back at this release tag (pi-vX.Y.Z) instead of building"
        type: string
        default: ""

permissions:
  contents: write

# The image build takes a while, so it gets its own group instead of holding
# up web deploys and firmware releases.
concurrency:
  group: pi-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IS_DEV: ${{ github.ref_name == 'dev' }}
  LATEST_TAG: pi-latest
  DEV_TAG: pi-dev
  WEEKLY_IMAGE_CRON: "17 4 * * 0"

jobs:
  rollback:
    if: inputs.rollback_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ROLLBACK_TAG: ${{ inputs.rollback_tag }}
    steps:
      - name: Point pi-latest at the rollback release
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::Pi rollbacks run from master. Dev installs follow pi-dev; dispatch a dev build instead."
            exit 1
          fi
          if ! [[ "$ROLLBACK_TAG" =~ ^pi-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$ROLLBACK_TAG is not a Pi release tag (pi-vX.Y.Z)."
            exit 1
          fi
          mkdir rollback
          if ! gh release download "$ROLLBACK_TAG" -p manifest.json -p install.sh -D rollback; then
            echo "::error::$ROLLBACK_TAG has no manifest.json and install.sh to roll back to."
            exit 1
          fi
          gh release upload "$LATEST_TAG" rollback/install.sh --clobber
          gh release upload "$LATEST_TAG" rollback/manifest.json --clobber
          gh release edit "$LATEST_TAG" --notes "Points Pi installs at [${ROLLBACK_TAG}](https://github.com/${GH_REPO}/releases/tag/${ROLLBACK_TAG}) (rollback). **mault-pi.img.xz** here is the newest SD image and is rebuilt weekly, so it can be a few releases behind: flash it, then update Mault (Update Mault in the app, or \`sudo mault update\`)."
          {
            echo "## Pi rollback to ${ROLLBACK_TAG}"
            echo ""
            echo "Production boards offer $(jq -r .version rollback/manifest.json) as their update; installs run its bundle and image."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: inputs.rollback_tag == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      manifest-url: ${{ steps.version.outputs.manifest-url }}
      should-release: ${{ steps.version.outputs.should-release }}
      image-mode: ${{ steps.version.outputs.image-mode }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      node: ${{ steps.toolchain.outputs.node }}
      pnpm: ${{ steps.toolchain.outputs.pnpm }}
    steps:
      # Anything but master or dev would ship unreleased code, so it's refused.
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "master" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Pi releases run from master (production) or dev (development), not ${{ github.ref_name }}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Pi version is the app version from packages/server/package.json
      # (the Release workflow bumps it), never bumped here: the API compares
      # it with the release manifest to offer updates.
      # BUNDLE_SOURCES is what scripts/pi/build-bundle.sh copies or builds
      # from. The package.json files are left out because every Release bumps
      # their version; a dependency change still shows in pnpm-lock.yaml.
      - name: Read app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE_SOURCES: >-
            packages/server packages/shared packages/web scripts/pi drizzle patches
            firmware/main/main.ino pnpm-lock.yaml pnpm-workspace.yaml Dockerfile.server
            :(exclude)packages/*/package.json
        run: |
          SKIP_REASON=""
          VERSION=$(jq -r .version packages/server/package.json)
          REPO_RELEASES="https://github.com/${{ github.repository }}/releases/download"
          if [ "$IS_DEV" = "true" ]; then
            VERSION="${VERSION}-dev.${GITHUB_RUN_NUMBER}"
            TAG="$DEV_TAG"
            MANIFEST_URL="$REPO_RELEASES/$DEV_TAG/manifest.json"
          else
            TAG="pi-v${VERSION}"
            MANIFEST_URL="$REPO_RELEASES/$LATEST_TAG/manifest.json"
            LAST_TAG=$(git tag -l 'pi-v*' --sort=-v:refname | head -1)
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              SKIP_REASON="$TAG is already released. The next Pi release needs a new app version."
            elif [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LAST_TAG" ] && git diff --quiet "$LAST_TAG" HEAD -- $BUNDLE_SOURCES; then
              SKIP_REASON="Nothing in the Pi bundle changed since $LAST_TAG."
            fi
          fi
          if [ -n "$SKIP_REASON" ]; then
            echo "::notice::$SKIP_REASON No bundle to release."
            echo "## Pi bundle release skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"
          fi

          # image-mode: none, new (from this run's bundle) or existing (from
          # the bundle of the release pi-latest points at).
          WANTS_IMAGE=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "$WEEKLY_IMAGE_CRON" ]; then WANTS_IMAGE=true; fi
          elif [ "${{ inputs.image }}" = "true" ]; then
            WANTS_IMAGE=true
          fi
          IMAGE_MODE=none
          IMAGE_TAG="$TAG"
          if [ "$WANTS_IMAGE" = "true" ] && [ -z "$SKIP_REASON" ]; then
            IMAGE_MODE=new
          elif [ "$WANTS_IMAGE" = "true" ] && [ "$IS_DEV" != "true" ]; then
            BUNDLE_URL=$(gh release download "$LATEST_TAG" -p manifest.json -O - 2>/dev/null | jq -r '.bundle // ""' || true)
            IMAGE_TAG=$(printf '%s' "$BUNDLE_URL" | sed -nE 's#.*/releases/download/(pi-v[0-9.]+)/.*#\1#p')
            if [ -z "$IMAGE_TAG" ]; then
              echo "::notice::$LATEST_TAG points at no Pi release yet, so there is no bundle to build an image from."
            elif [ "${{ github.event_name }}" = "schedule" ] && gh release view "$IMAGE_TAG" --json assets --jq '.assets[].name' | grep -qx mault-pi.img.xz; then
              echo "::notice::$IMAGE_TAG already has an SD image. Nothing to rebuild."
            else
              IMAGE_MODE=existing
            fi
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "manifest-url=$MANIFEST_URL"
            echo "should-release=$([ -z "$SKIP_REASON" ] && echo true || echo false)"
            echo "image-mode=$IMAGE_MODE"
            echo "image-tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Read toolchain pins
        id: toolchain
        run: |
          NODE=$(sed -nE 's/^FROM node:([0-9]+).*/\1/p' Dockerfile.server | head -1)
          PNPM=$(sed -nE 's/^RUN npm install -g pnpm@([0-9.]+).*/\1/p' Dockerfile.server | head -1)
          if [ -z "$NODE" ] || [ -z "$PNPM" ]; then
            echo "::error::Cannot read the Node and pnpm pins from Dockerfile.server."
            exit 1
          fi
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "pnpm=$PNPM" >> "$GITHUB_OUTPUT"

  bundle:
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    container: node:${{ needs.prepare.outputs.node }}-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@${{ needs.prepare.outputs.pnpm }}

      - name: Build bundle
        run: |
          bash scripts/pi/build-bundle.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --manifest-url "${{ needs.prepare.outputs.manifest-url }}" \
            --out dist-pi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: pi-bundle
          path: dist-pi/
          retention-days: 7

  image:
    needs: [prepare, bundle]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.image-mode != 'none'
      && (needs.bundle.result == 'success' || needs.prepare.outputs.image-mode == 'existing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download this run's bundle
        if: needs.prepare.outputs.image-mode == 'new'
        uses: actions/download-artifact@v4
        with:
          name: pi-bundle
          path: dist-pi

      - name: Download the released bundle
        if: needs.prepare.outputs.image-mode == 'existing'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "${{ needs.prepare.outputs.image-tag }}" -p mault-pi-arm64.tar.gz -D dist-pi

      - name: Stage bundle for the image
        run: |
          mkdir -p scripts/pi/image/stage-mault/00-mault/files
          cp dist-pi/mault-pi-arm64.tar.gz scripts/pi/image/stage-mault/00-mault/files/
          chmod +x scripts/pi/image/stage-mault/prerun.sh scripts/pi/image/stage-mault/00-mault/00-run.sh

      # Nobody can sign in to the image's default account. Owners set their
      # own login, SSH and Wi-Fi in mault-config.txt on the boot partition
      # (scripts/pi/boot-config.py), since Imager offers no OS customisation
      # for custom images. Mault itself needs no login on the board.
      - name: Generate a locked default password
        id: password
        run: |
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          echo "value=$PASSWORD" >> "$GITHUB_OUTPUT"

      # pi-gen needs about 20 GB. The action's own increase-runner-disk-size
      # removes a fixed apt package list that breaks whenever the runner image
      # changes (apt exit 100), so free the space by deleting toolchains this
      # job never uses instead.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup             /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build image
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: mault-pi
          release: trixie
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./scripts/pi/image/stage-mault
          hostname: mault
          username: mault-admin
          password: ${{ steps.password.outputs.value }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: en_US.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          timezone: Etc/UTC
          wpa-country: US
          compression: xz
          compression-level: 6
          increase-runner-disk-size: false

      - name: Name image
        run: cp "${{ steps.build.outputs.image-path }}" mault-pi.img.xz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: mault-pi.img.xz
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, bundle, image]
    if: always() && needs.bundle.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          ASSETS="artifacts/mault-pi-arm64.tar.gz artifacts/install.sh"
          if [ -f artifacts/mault-pi.img.xz ]; then
            ASSETS="$ASSETS artifacts/mault-pi.img.xz"
          fi
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: Publish dev release
        if: env.IS_DEV == 'true'
        run: |
          gh release delete "$DEV_TAG" --cleanup-tag -y 2>/dev/null || true
          # shellcheck disable=SC2086
          gh release create "$DEV_TAG" $ASSETS artifacts/manifest.json \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Mault for Raspberry Pi v${VERSION} (dev)" \
            --notes "Dev build from ${{ github.sha }}. Dev installs update from this release; the next dev build replaces it."

      # The versioned release holds the bundle and image. pi-latest only holds
      # the manifest (pointing at this release's bundle) and the installer, so
      # production update checks and the install command keep one address.
      - name: Publish release
        if: env.IS_DEV != 'true'
        run: |
          BUNDLE_URL="https://github.com/${GH_REPO}/releases/download/${TAG}/mault-pi-arm64.tar.gz"
          jq --arg bundle "$BUNDLE_URL" '.bundle = $bundle' artifacts/manifest.json > manifest.json
          if [ -f artifacts/mault-pi.img.xz ]; then
            IMAGE_NOTE="- **mault-pi.img.xz** - flash with Raspberry Pi Imager, boot, then open http://mault.local"
          else
            IMAGE_NOTE="- **SD image** - not built for this release. Flash [mault-pi.img.xz](https://github.com/${GH_REPO}/releases/download/${LATEST_TAG}/mault-pi.img.xz), boot, then update Mault to get this release"
          fi
          NOTES="Mault v${VERSION} for Raspberry Pi and other arm64 Linux boards, built from ${{ github.sha }}.

          ${IMAGE_NOTE}
          - **install.sh** - other arm64 boards: \`curl -fsSL https://github.com/${GH_REPO}/releases/download/${LATEST_TAG}/install.sh | sudo bash\`
          - **Update** - \`sudo mault update\`, or Update Mault in the app"
          # shellcheck disable=SC2086
          gh release create "$TAG" $ASSETS manifest.json \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "Mault for Raspberry Pi v${VERSION}" \
            --notes "$NOTES"
          if ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release create "$LATEST_TAG" --latest=false --title "Mault for Raspberry Pi (latest)" \
              --notes "Points Pi installs at the newest production release. Download the image from the versioned pi-v* releases."
          fi
          gh release upload "$LATEST_TAG" artifacts/install.sh --clobber
          gh release upload "$LATEST_TAG" manifest.json --clobber
          if [ -f artifacts/mault-pi.img.xz ]; then
            gh release upload "$LATEST_TAG" artifacts/mault-pi.img.xz --clobber
          fi
          gh release edit "$LATEST_TAG" --notes "Points Pi installs at [${TAG}](https://github.com/${GH_REPO}/releases/tag/${TAG}). **mault-pi.img.xz** here is the newest SD image and is rebuilt weekly, so it can be a few releases behind: flash it, then update Mault (Update Mault in the app, or \`sudo mault update\`)."

      - name: Summary
        run: |
          {
            echo "## Mault for Raspberry Pi ${{ env.IS_DEV == 'true' && 'dev build' || 'release' }} v${VERSION}"
            echo ""
            echo "- Release: [${TAG}](https://github.com/${GH_REPO}/releases/tag/${TAG})"
            echo "- Image: ${{ needs.image.result == 'success' && 'built' || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # An image built for a release that already exists is added to that release
  # and replaces the one on pi-latest.
  publish-image:
    needs: [prepare, image]
    if: always() && needs.prepare.outputs.image-mode == 'existing' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: pi-image
          path: artifacts

      - name: Publish image
        run: |
          gh release upload "$IMAGE_TAG" artifacts/mault-pi.img.xz --clobber
          gh release upload "$LATEST_TAG" artifacts/mault-pi.img.xz --clobber
          gh release edit "$LATEST_TAG" --notes "Points Pi installs at [${IMAGE_TAG}](https://github.com/${GH_REPO}/releases/tag/${IMAGE_TAG}). **mault-pi.img.xz** here is the newest SD image and is rebuilt weekly, so it can be a few releases behind: flash it, then update Mault (Update Mault in the app, or \`sudo mault update\`)."
          {
            echo "## Mault for Raspberry Pi SD image rebuilt"
            echo ""
            echo "- Built from the bundle of [${IMAGE_TAG}](https://github.com/${GH_REPO}/releases/tag/${IMAGE_TAG})"
            echo "- Download: https://github.com/${GH_REPO}/releases/download/${LATEST_TAG}/mault-pi.img.xz"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [rollback, prepare, bundle, image, publish, publish-image]
    if: always() && github.ref_name != 'dev'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Notify Discord (release)
        if: needs.publish.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg version "${{ needs.prepare.outputs.version }}" \
              --arg image "${{ needs.image.result }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Mault for Raspberry Pi v" + $version + " released" + (if $image == "success" then " (bundle + SD image)" else " (bundle only)" end)),
                  url: $url,
                  color: 5763719,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (image)
        if: needs.publish-image.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "${{ needs.prepare.outputs.image-tag }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.image-tag }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Mault for Raspberry Pi SD image rebuilt from " + $tag),
                  url: $url,
                  color: 5763719,
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (rollback)
        if: needs.rollback.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "${{ inputs.rollback_tag }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.rollback_tag }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Mault for Raspberry Pi rolled back to " + $tag),
                  url: $url,
                  color: 5763719,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (failure)
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL isn't set for this environment, skipping."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: "Raspberry Pi release failed",
                  description: "Check the run log.",
                  url: $url,
                  color: 15548997,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"
