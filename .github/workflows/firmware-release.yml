name: Firmware Release

on:
  push:
    branches: [master]
    paths:
      - "firmware/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: firmware-release-master
  cancel-in-progress: false

env:
  FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc
  BUILD_DIR: firmware/main/build/esp32.esp32.esp32s3
  FIRMWARE_DEST: packages/web/public/firmware/esp32-latest.bin
  UNO_FQBN: arduino:renesas_uno:minima
  UNO_BUILD_DIR: firmware/main/build/arduino.renesas_uno.minima
  UNO_WIFI_FQBN: arduino:renesas_uno:unor4wifi
  UNO_WIFI_BUILD_DIR: firmware/main/build/arduino.renesas_uno.unor4wifi

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mault.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute firmware version
        id: version
        run: |
          CURRENT=$(grep -oP '#define FIRMWARE_VERSION "\K[^"]+' firmware/main/main.ino)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read FIRMWARE_VERSION from firmware/main/main.ino"
            exit 1
          fi
          MAJOR_MINOR=$(echo "$CURRENT" | grep -oP '^\d+\.\d+')
          CURRENT_PATCH=$(echo "$CURRENT" | grep -oP '\d+$')
          LAST=$(git tag -l "firmware-v${MAJOR_MINOR}.*" | sed -E "s/^firmware-v${MAJOR_MINOR}\.//" | sort -n | tail -1)
          if [ -z "$LAST" ]; then
            PATCH="$CURRENT_PATCH"
          else
            PATCH=$((LAST + 1))
          fi
          VERSION="${MAJOR_MINOR}.${PATCH}"
          sed -i "s/#define FIRMWARE_VERSION \"[^\"]*\"/#define FIRMWARE_VERSION \"$VERSION\"/" firmware/main/main.ino
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install arduino:renesas_uno

      - name: Verify Arduino cores
        run: |
          arduino-cli core list
          arduino-cli board listall | grep -E "UNO R4|unor4"

      - name: Install libraries
        run: |
          arduino-cli lib install ArduinoJson
          arduino-cli lib install "Adafruit PWM Servo Driver Library"

      - name: Compile (ESP32)
        run: arduino-cli compile --fqbn "$FQBN" --export-binaries firmware/main

      - name: Compile (Uno R4 Minima)
        run: arduino-cli compile --fqbn "$UNO_FQBN" --export-binaries firmware/main

      - name: Compile (Uno R4 WiFi)
        run: arduino-cli compile --fqbn "$UNO_WIFI_FQBN" --export-binaries firmware/main

      - name: Prepare Uno R4 release assets
        run: |
          mkdir -p dist
          cp "$UNO_BUILD_DIR/main.ino.bin" "dist/arduino-uno-r4-minima-v${{ steps.version.outputs.version }}.bin"
          cp "$UNO_WIFI_BUILD_DIR/main.ino.bin" "dist/arduino-uno-r4-wifi-v${{ steps.version.outputs.version }}.bin"

      - name: Set up Python (for esptool merge fallback)
        if: hashFiles(format('{0}/main.ino.merged.bin', env.BUILD_DIR)) == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Recent arduino-esp32 core versions produce a merged bin
      # automatically (bootloader + partitions + app, one flashable image at
      # offset 0). Fall back to building it by hand if the installed core
      # version doesn't - same offsets documented in PROTOCOL.md/the build
      # guide's firmware phase.
      - name: Merge binary (fallback)
        if: hashFiles(format('{0}/main.ino.merged.bin', env.BUILD_DIR)) == ''
        run: |
          pip install esptool
          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin not found in the installed esp32 core"
            exit 1
          fi
          esptool.py --chip esp32s3 merge_bin \
            -o "$BUILD_DIR/main.ino.merged.bin" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x0     "$BUILD_DIR/main.ino.bootloader.bin" \
            0x8000  "$BUILD_DIR/main.ino.partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/main.ino.bin"

      - name: Place binary in packages/web/public/firmware
        run: |
          mkdir -p "$(dirname "$FIRMWARE_DEST")"
          cp "$BUILD_DIR/main.ino.merged.bin" "$FIRMWARE_DEST"

      - name: Commit firmware version and binary
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main/main.ino "$FIRMWARE_DEST"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(firmware): release v${{ steps.version.outputs.version }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the default GITHUB_TOKEN don't trigger other
      # workflow runs (GitHub's built-in loop guard), so deploy.yml's own
      # `push: branches: [master]` trigger won't fire for the commit above -
      # without this, the live site would keep serving whatever firmware
      # binary was already baked into the currently-deployed image until
      # some unrelated change happened to redeploy web next.
      - name: Trigger Coolify deployment (web)
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="firmware-v${{ steps.version.outputs.version }}"
          UNO_ASSET="dist/arduino-uno-r4-minima-v${{ steps.version.outputs.version }}.bin"
          UNO_WIFI_ASSET="dist/arduino-uno-r4-wifi-v${{ steps.version.outputs.version }}.bin"
          NOTES="Built from firmware/main/main.ino at ${{ github.sha }}.

          - **esp32-latest.bin** - same binary the app fetches for browser flashing (see /build). Merged image, flash at offset 0.
          - **arduino-uno-r4-minima-v${{ steps.version.outputs.version }}.bin** / **arduino-uno-r4-wifi-v${{ steps.version.outputs.version }}.bin** - not browser-flashable (Renesas bootloader), flash manually: \`arduino-cli upload -i <file> --fqbn arduino:renesas_uno:minima -p <port>\` (swap unor4_wifi for the WiFi board), or open main.ino in the Arduino IDE directly."

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading binaries to it instead."
            gh release upload "$TAG" "$FIRMWARE_DEST" "$UNO_ASSET" "$UNO_WIFI_ASSET" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$FIRMWARE_DEST" "$UNO_ASSET" "$UNO_WIFI_ASSET" \
              --repo "${{ github.repository }}" \
              --title "Firmware v${{ steps.version.outputs.version }}" \
              --notes "$NOTES"
          fi

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg version "${{ steps.version.outputs.version }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/firmware-v${{ steps.version.outputs.version }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Firmware v" + $version + " released (ESP32 + Uno R4 Minima + WiFi)"),
                  url: $url,
                  color: 5763719,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: "Firmware build failed",
                  description: "Check the run log.",
                  url: $url,
                  color: 15548997,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"
