name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      rollback_tag:
        description: "Rollback: compile this firmware tag's sketch (firmware-vX.Y.Z) as the next version, so boards update to it. Only the version line and binary change on the branch."
        type: string
        default: ""

permissions:
  contents: write
  actions: write

# Dispatching from dev builds a dev firmware: nothing is committed, the binary
# goes to the moving firmware-dev pre-release, and only dev deploys pick it up
# (deploy.yml swaps it into the web image). A production release deletes
# firmware-dev so dev falls back to the committed binary.
concurrency:
  group: ${{ github.ref_name == 'dev' && 'dev-release-pipeline' || 'master-release-pipeline' }}
  cancel-in-progress: false

env:
  FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=dio,PartitionScheme=min_spiffs
  FIRMWARE_DEST: packages/web/public/firmware/esp32-latest.bin
  UNO_FQBN: arduino:renesas_uno:minima
  UNO_WIFI_FQBN: arduino:renesas_uno:unor4wifi
  DEV_TAG: firmware-dev

# Stages: build (compile every board) -> publish (commit, releases, deploy
# trigger) -> notify. A failed publish can be re-run without recompiling.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_DEV: ${{ github.ref_name == 'dev' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute firmware version
        id: version
        run: |
          CURRENT=$(grep -oP '#define FIRMWARE_VERSION "\K[^"]+' firmware/main/main.ino)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read FIRMWARE_VERSION from firmware/main/main.ino"
            exit 1
          fi
          CURRENT="${CURRENT%%-*}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          case "${{ inputs.bump }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)
              MAJOR_MINOR="${MAJOR}.${MINOR}"
              CURRENT_PATCH=$(echo "$CURRENT" | cut -d. -f3)
              LAST=$(git tag -l "firmware-v${MAJOR_MINOR}.*" | sed -E "s/^firmware-v${MAJOR_MINOR}\.//" | sort -n | tail -1)
              if [ -z "$LAST" ]; then
                PATCH="$CURRENT_PATCH"
              else
                PATCH=$((LAST + 1))
              fi
              VERSION="${MAJOR_MINOR}.${PATCH}"
              ;;
          esac
          TAG="firmware-v${VERSION}"
          if [ "$IS_DEV" != "true" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if [ "$IS_DEV" = "true" ]; then
            VERSION="${VERSION}-dev.${GITHUB_RUN_NUMBER}"
            TAG="$DEV_TAG"
          fi
          sed -i "s/#define FIRMWARE_VERSION \"[^\"]*\"/#define FIRMWARE_VERSION \"$VERSION\"/" firmware/main/main.ino
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The app reads the bundled binary's version from main.ino and boards
      # never install a lower one, so a rollback compiles the tag's sketch in
      # its own worktree under the next version. The branch keeps its source;
      # only the version line and the binary are committed.
      - name: Pick sketch source
        id: source
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SKETCH_DIR=firmware/main
          SOURCE_SHA="${{ github.sha }}"
          if [ -n "$ROLLBACK_TAG" ]; then
            if ! [[ "$ROLLBACK_TAG" =~ ^firmware-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$ROLLBACK_TAG" >/dev/null; then
              echo "::error::$ROLLBACK_TAG is not a firmware release tag (firmware-vX.Y.Z)."
              exit 1
            fi
            git worktree add --detach .rollback-src "$ROLLBACK_TAG"
            SKETCH_DIR=.rollback-src/firmware/main
            SOURCE_SHA=$(git rev-parse "$ROLLBACK_TAG^{commit}")
            sed -i "s/#define FIRMWARE_VERSION \"[^\"]*\"/#define FIRMWARE_VERSION \"$VERSION\"/" "$SKETCH_DIR/main.ino"
            echo "Compiling $ROLLBACK_TAG as v$VERSION"
          fi
          {
            echo "SKETCH_DIR=$SKETCH_DIR"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "BUILD_DIR=$SKETCH_DIR/build/esp32.esp32.esp32s3"
            echo "UNO_BUILD_DIR=$SKETCH_DIR/build/arduino.renesas_uno.minima"
            echo "UNO_WIFI_BUILD_DIR=$SKETCH_DIR/build/arduino.renesas_uno.unor4wifi"
          } >> "$GITHUB_ENV"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install arduino:renesas_uno

      - name: Verify Arduino cores
        run: |
          arduino-cli core list
          arduino-cli board listall | grep -E "UNO R4|unor4"

      - name: Install libraries
        run: |
          arduino-cli lib install ArduinoJson
          arduino-cli lib install "Adafruit PWM Servo Driver Library"
          arduino-cli lib install ArduinoBLE

      - name: Compile (ESP32)
        run: arduino-cli compile --fqbn "$FQBN" --export-binaries "$SKETCH_DIR"

      - name: Compile (Uno R4 Minima)
        run: arduino-cli compile --fqbn "$UNO_FQBN" --export-binaries "$SKETCH_DIR"

      - name: Compile (Uno R4 WiFi)
        run: arduino-cli compile --fqbn "$UNO_WIFI_FQBN" --export-binaries "$SKETCH_DIR"

      - name: Prepare Uno R4 release assets
        run: |
          mkdir -p dist
          cp "$UNO_BUILD_DIR/main.ino.bin" "dist/arduino-uno-r4-minima-v${{ steps.version.outputs.version }}.bin"
          cp "$UNO_WIFI_BUILD_DIR/main.ino.bin" "dist/arduino-uno-r4-wifi-v${{ steps.version.outputs.version }}.bin"

      - name: Set up Python (for esptool merge fallback)
        if: hashFiles(format('{0}/main.ino.merged.bin', env.BUILD_DIR)) == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Recent arduino-esp32 core versions produce a merged bin
      # automatically (bootloader + partitions + app, one flashable image at
      # offset 0). Fall back to building it by hand if the installed core
      # version doesn't - same offsets documented in PROTOCOL.md/the build
      # guide's firmware phase.
      - name: Merge binary (fallback)
        if: hashFiles(format('{0}/main.ino.merged.bin', env.BUILD_DIR)) == ''
        run: |
          pip install esptool
          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin not found in the installed esp32 core"
            exit 1
          fi
          esptool.py --chip esp32s3 merge_bin \
            -o "$BUILD_DIR/main.ino.merged.bin" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x0     "$BUILD_DIR/main.ino.bootloader.bin" \
            0x8000  "$BUILD_DIR/main.ino.partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/main.ino.bin"

      - name: Place binary in packages/web/public/firmware
        run: |
          mkdir -p "$(dirname "$FIRMWARE_DEST")"
          cp "$BUILD_DIR/main.ino.merged.bin" "$FIRMWARE_DEST"

      # The branch's main.ino carries the new version line; the binaries are
      # what publish commits and attaches to the release.
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/
            firmware/main/main.ino
            ${{ env.FIRMWARE_DEST }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ vars.APP_URL }}
    env:
      IS_DEV: ${{ github.ref_name == 'dev' }}
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: .

      - name: Commit firmware version and binary
        id: commit
        if: env.IS_DEV != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main/main.ino "$FIRMWARE_DEST"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(firmware): release v$VERSION"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The firmware binary is baked into the web image, which only the deploy
      # workflow builds, so the live site keeps serving the old binary until
      # a deploy runs. It shares this workflow's concurrency group, so it
      # queues behind this run and builds from the commit above.
      - name: Publish dev release
        if: env.IS_DEV == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" > dist/version.txt
          gh release delete "$DEV_TAG" --repo "${{ github.repository }}" --cleanup-tag -y 2>/dev/null || true
          gh release create "$DEV_TAG" "$FIRMWARE_DEST" dist/version.txt             "dist/arduino-uno-r4-minima-v${VERSION}.bin" "dist/arduino-uno-r4-wifi-v${VERSION}.bin"             --repo "${{ github.repository }}"             --target "$SOURCE_SHA"             --prerelease             --title "Firmware v${VERSION} (dev)"             --notes "Dev firmware built from ${SOURCE_SHA}. Only dev deploys flash this binary; the next production firmware release replaces it."

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true' || env.IS_DEV == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Create release
        if: env.IS_DEV != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="firmware-v$VERSION"
          UNO_ASSET="dist/arduino-uno-r4-minima-v$VERSION.bin"
          UNO_WIFI_ASSET="dist/arduino-uno-r4-wifi-v$VERSION.bin"
          NOTES="Built from firmware/main/main.ino at ${SOURCE_SHA}${{ inputs.rollback_tag != '' && format(' (rollback to {0})', inputs.rollback_tag) || '' }}.

          - **esp32-latest.bin** - same binary the app fetches for browser flashing (see /build). Merged image, flash at offset 0.
          - **arduino-uno-r4-minima-v$VERSION.bin** / **arduino-uno-r4-wifi-v$VERSION.bin** - not browser-flashable (Renesas bootloader), flash manually: \`arduino-cli upload -i <file> --fqbn arduino:renesas_uno:minima -p <port>\` (swap unor4_wifi for the WiFi board), or open main.ino in the Arduino IDE directly."

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading binaries to it instead."
            gh release upload "$TAG" "$FIRMWARE_DEST" "$UNO_ASSET" "$UNO_WIFI_ASSET" --repo "${{ github.repository }}" --clobber
          else
            TARGET_ARGS=()
            if [ -n "${{ inputs.rollback_tag }}" ]; then
              TARGET_ARGS=(--target "$SOURCE_SHA")
            fi
            gh release create "$TAG" "$FIRMWARE_DEST" "$UNO_ASSET" "$UNO_WIFI_ASSET" "${TARGET_ARGS[@]}" \
              --repo "${{ github.repository }}" \
              --title "Firmware v$VERSION" \
              --notes "$NOTES"
          fi
          gh release delete "$DEV_TAG" --repo "${{ github.repository }}" --cleanup-tag -y 2>/dev/null || true

  notify:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    steps:
      - name: Notify Discord (success)
        if: needs.publish.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg version "${{ needs.build.outputs.version }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: ("Firmware v" + $version + " released (ESP32 + Uno R4 Minima + WiFi)"),
                  url: $url,
                  color: 5763719,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"

      - name: Notify Discord (failure)
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${GITHUB_SHA::7}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg author "${{ github.actor }}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: "Firmware build failed",
                  description: "Check the run log.",
                  url: $url,
                  color: 15548997,
                  fields: [
                    { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                    { name: "Author", value: $author, inline: true }
                  ],
                  timestamp: $ts
                }]
              }')"
