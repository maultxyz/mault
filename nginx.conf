server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets if available
    gzip_static on;

    # Reverse-proxies /api/* to the server container, stripping the prefix -
    # every frontend API call is hardcoded as /api/... (see lib/api/client.ts
    # callers), but server routes are registered without that prefix (see
    # CLAUDE.md's Vite-dev-proxy note); in dev, Vite's proxy does this same
    # strip-and-forward. Purely additive for a standalone Dockerfile.web
    # deployment (VITE_API_URL pointed at an external host, per README's
    # "Deploying with Neon" section) - that flow's frontend never sends
    # requests here at all. The upstream is resolved lazily via a variable
    # (Docker's embedded DNS at 127.0.0.11) rather than at nginx startup, so
    # this doesn't fail to start even when no "server" host exists on the
    # network - it would only 502 if something actually hit /api/* there.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # `set` must come before `rewrite ... break` - break halts the rest
        # of the rewrite-phase directives for this request, so a `set` after
        # it never runs and $api_upstream is left uninitialized.
        set $api_upstream server:3001;
        # proxy_pass with a variable target (needed above for lazy DNS
        # resolution) disables nginx's usual automatic prefix-stripping, so
        # the strip has to happen explicitly here instead.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE endpoints (collection lock/live-count/session streams) need
        # unbuffered, long-lived connections - default proxy buffering would
        # delay/batch events instead of streaming them.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
