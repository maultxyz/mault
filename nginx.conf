map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}

map $sent_http_content_type $html_cache_control {
    ~text/html "no-cache";
    default "";
}

map $uri $cache_control {
    /sw.js "no-cache";
    /env.js "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    default $html_cache_control;
}

# Expo social sign-in: Neon returns to the site root or the callback path
# with the session verifier (or an error). Only browsers that started at
# /auth/mobile-start carry the cookie, so web sign-ins are untouched.
map "$cookie_mault_mobile_social_sign_in|$arg_neon_auth_session_verifier$arg_error" $mobile_social_sign_in_return {
    "~^1\|.+" 1;
    default "";
}

# Public share pages may be embedded elsewhere; the app itself never is.
map $request_uri $frame_ancestors_policy {
    ~^/(watch|shared|shop|s)(/|\?|$) "";
    default "frame-ancestors 'self'";
}

# Cross-origin isolation lets onnxruntime-web run multithreaded. The build
# guide embeds YouTube, which Firefox blocks under COEP, so it stays out.
map $request_uri $cross_origin_opener_policy {
    ~^/build(/|\?|$) "";
    default "same-origin";
}

map $request_uri $cross_origin_embedder_policy {
    ~^/build(/|\?|$) "";
    default "credentialless";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control;
    add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy;
    add_header Cross-Origin-Embedder-Policy $cross_origin_embedder_policy;
    add_header Content-Security-Policy $frame_ancestors_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # Serve pre-compressed assets if available, otherwise compress on the fly
    # (the Vite build doesn't emit .gz files, so gzip_static alone served
    # every JS/CSS/JSON asset uncompressed).
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Reverse-proxies /api/* to the server container, stripping the prefix -
    # every frontend API call is hardcoded as /api/... (see lib/api/client.ts
    # callers), but server routes are registered without that prefix (see
    # CLAUDE.md's Vite-dev-proxy note); in dev, Vite's proxy does this same
    # strip-and-forward. Purely additive for a standalone Dockerfile.web
    # deployment (VITE_API_URL pointed at an external host, per README's
    # "Deploying with Neon" section) - that flow's frontend never sends
    # requests here at all. The upstream is resolved lazily via a variable
    # (Docker's embedded DNS at 127.0.0.11) rather than at nginx startup, so
    # this doesn't fail to start even when no "server" host exists on the
    # network - it would only 502 if something actually hit /api/* there.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # `set` must come before `rewrite ... break` - break halts the rest
        # of the rewrite-phase directives for this request, so a `set` after
        # it never runs and $api_upstream is left uninitialized.
        set $api_upstream server:3001;
        # proxy_pass with a variable target (needed above for lazy DNS
        # resolution) disables nginx's usual automatic prefix-stripping, so
        # the strip has to happen explicitly here instead.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE endpoints (collection lock/live-count/session streams) need
        # unbuffered, long-lived connections - default proxy buffering would
        # delay/batch events instead of streaming them.
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 32m;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Module scripts must have a JavaScript MIME type, and nginx's mime.types
    # has no .mjs entry (onnxruntime-web's threaded glue is an .mjs asset).
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # Neon Auth on the site's own origin (env.js VITE_NEON_AUTH_PROXY_PATH),
    # so its challenge and session cookies are first party: Safari blocks
    # them as third-party cookies when the web client calls Neon directly,
    # and social sign-in then lands back on the sign-in page.
    location ~ ^/neon-auth/(.*)$ {
        include /etc/nginx/neon-auth.conf;
        if ($neon_auth_url = "") {
            return 404;
        }
        proxy_pass $neon_auth_url/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Expo app opens social sign-in here (shared
    # MOBILE_SOCIAL_SIGN_IN_START_PATH): mark the browser, then continue to
    # Neon's start URL. $neon_auth_url comes from docker/web-env.sh.
    location = /auth/mobile-start {
        include /etc/nginx/neon-auth.conf;
        if ($neon_auth_url = "") {
            return 404;
        }
        if ($arg_token !~ "^[0-9A-Za-z_-]{8,128}$") {
            return 400;
        }
        add_header Set-Cookie "mault_mobile_social_sign_in=1; Max-Age=600; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 "$neon_auth_url/sign-in/social/init?token=$arg_token";
    }

    # Hands the verifier to the app (shared MOBILE_SOCIAL_SIGN_IN_APP_CALLBACK_URL)
    # with a server redirect, which keeps the sign-in gesture so Android Custom
    # Tabs open the app, and before the web app's Neon client consumes it.
    location = / {
        if ($mobile_social_sign_in_return) {
            add_header Set-Cookie "mault_mobile_social_sign_in=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax" always;
            add_header Cache-Control "no-store" always;
            return 302 "mault://auth-callback$is_args$args";
        }
        try_files /index.html =404;
    }

    location = /auth/mobile-callback {
        add_header Set-Cookie "mault_mobile_social_sign_in=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 "mault://auth-callback$is_args$args";
    }

    # Share links (collections, storage, cards, shop catalogs) get per-link
    # titles, descriptions and images for link previews and search engines,
    # which don't run the app's JavaScript. share.html includes the API's tags
    # through SSI and falls back to the default tags when the API can't answer.
    location ~ ^/(watch|shared|shop)/ {
        ssi on;
        ssi_silent_errors on;
        try_files /share.html =404;
    }

    # SSI subrequests keep the page's $request_uri, so the API gets the share
    # path and token. The upstream is written by docker/web-env.sh from
    # VITE_API_URL. Accept-Encoding is cleared so the API never answers with a
    # compressed body that would be pasted into the page as is.
    location = /__share_preview {
        internal;
        include /etc/nginx/share-preview.conf;
        proxy_pass $share_preview_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_intercept_errors on;
        error_page 400 401 403 404 429 500 502 503 504 = @share_preview_unavailable;
    }

    location @share_preview_unavailable {
        return 204;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
